name: release notes
description: >-
  Release body for a vX.Y.Z tag: that version's debian/changelog entry plus the
  asset line. One source, so the three tag workflows racing to create the
  release all write the same text and any of them can win. Each guards its
  `gh release create` with `|| gh release view`, so losing the race is fine but
  a real gh failure still stops the job.

outputs:
  file:
    description: path to the generated notes file
    value: ${{ steps.notes.outputs.file }}

runs:
  using: composite
  steps:
    - id: notes
      shell: bash
      run: |
        set -euo pipefail
        ver="${GITHUB_REF_NAME#v}"
        out="${RUNNER_TEMP}/release-notes.md"
        awk -v v="$ver" '
          index($0, "ghee (" v ")") == 1 { on = 1; next }
          on && /^ -- / { exit }
          on { sub(/^  /, ""); print }
        ' debian/changelog | sed '/./,$!d' > "$out"
        if [ ! -s "$out" ]; then
          echo "debian/changelog has no entry for $ver; add one before tagging" >&2
          exit 1
        fi
        echo "python3-ghee ${ver} debs: arm64 (bookworm, trixie) and armhf ARMv6" \
          "(Raspbian bookworm), plus the Python sdist." >> "$out"
        echo "file=$out" >> "$GITHUB_OUTPUT"
        cat "$out"
