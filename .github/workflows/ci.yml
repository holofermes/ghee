name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GLES and DRM development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgles2-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path python/Cargo.toml
      - run: cargo clippy --release --manifest-path python/Cargo.toml -- -D warnings
      # A GitHub runner exposes no /dev/dri and carries no ffmpeg, and
      # --cfg ghee_no_gpu and --cfg ghee_no_ffmpeg report every test that needs
      # them as ignored. Hardware gates the render itself, through the golden
      # check.
      - run: cargo test --release
        env:
          RUSTFLAGS: --cfg ghee_no_gpu --cfg ghee_no_ffmpeg
      - name: uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uvx ruff check python
      # The shim tests drive the scene shim with no GL device, through the wheel
      # that pip installs, on the oldest CPython that the wheel takes, and numpy
      # feeds their numpy rows.
      - run: cd python && uvx maturin build --release --compatibility linux
      - run: >-
          uv run --no-project --no-cache --python 3.10 --with pytest --with numpy
          --with python/target/wheels/ghee_render-*.whl
          pytest python/tests/test_shim.py
