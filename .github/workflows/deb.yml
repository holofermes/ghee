name: deb

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: build the deb (arm64 bookworm under qemu)
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" debian:bookworm bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential debhelper dh-python python3-all python3-setuptools \
              python3-numpy cmake pkg-config libdrm-dev libgbm-dev \
              libegl1-mesa-dev libgles2-mesa-dev
            mkdir -p /work && cp -r /src /work/ghee && cd /work/ghee
            dpkg-buildpackage -us -uc -b
            cp /work/*.deb /out/
            ls -la /out'
      # One deb ships to both releases, so install-test it on both.
      - name: install-test in a fresh container
        run: |
          for dist in bookworm trixie; do
            echo "=== $dist ==="
            docker run --rm --platform linux/arm64 \
              -v "$PWD/out:/out:ro" debian:$dist bash -ec '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /out/*.deb
              python3 -c "import ghee; print(\"import ok\")"
              ghee --help > /dev/null
              echo "cli ok"
              python3 -c "from ghee.engine import bundled_lib; p = bundled_lib(); assert p, \"engine lib not found\"; print(\"engine at\", p)"
              dpkg -s python3-ghee | grep ^Depends'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: python3-ghee-arm64
          path: out/*.deb
      - uses: ./.github/actions/release-notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
      - name: publish to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          ver=$(dpkg-deb -f out/python3-ghee_*.deb Version | awk '{print $NF}')
          asset="python3-ghee_${ver}_arm64.deb"
          cp out/python3-ghee_*.deb "$asset"
          gh release create "${GITHUB_REF_NAME}" --notes-file "$NOTES" \
            || gh release view "${GITHUB_REF_NAME}" > /dev/null
          gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
