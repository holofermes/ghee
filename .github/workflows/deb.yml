name: deb

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  arm64-bookworm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: build the deb (arm64 bookworm under qemu)
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" debian:bookworm bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential debhelper dh-python python3-all python3-setuptools \
              python3-numpy cmake pkg-config libdrm-dev libgbm-dev \
              libegl1-mesa-dev libgles2-mesa-dev libjpeg-dev
            mkdir -p /work && cp -r /src /work/ghee && cd /work/ghee
            dpkg-buildpackage -us -uc -b
            cp /work/*.deb /out/
            ls -la /out'
      - name: install-test in a fresh container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/out:/out:ro" debian:bookworm bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /out/*.deb
            python3 -c "import ghee; print(\"import ok\")"
            ghee --help > /dev/null && echo "cli ok"
            test -n "$(dpkg -L python3-ghee | grep libghee.so)" && echo "engine shipped"
            dpkg -s python3-ghee | grep ^Depends'
      - uses: actions/upload-artifact@v4
        with:
          name: python3-ghee-arm64-bookworm
          path: out/*.deb
