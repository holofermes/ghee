name: deb

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dist: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: build the deb (arm64 ${{ matrix.dist }} under qemu)
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" debian:${{ matrix.dist }} bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential debhelper dh-python python3-all python3-setuptools \
              python3-numpy cmake pkg-config libdrm-dev libgbm-dev \
              libegl1-mesa-dev libgles2-mesa-dev libjpeg-dev
            mkdir -p /work && cp -r /src /work/ghee && cd /work/ghee
            dpkg-buildpackage -us -uc -b
            cp /work/*.deb /out/
            ls -la /out'
      - name: install-test in a fresh container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/out:/out:ro" debian:${{ matrix.dist }} bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /out/*.deb
            python3 -c "import ghee; print(\"import ok\")"
            ghee --help > /dev/null
            echo "cli ok"
            python3 -c "from ghee.engine import bundled_lib; p = bundled_lib(); assert p, \"engine lib not found\"; print(\"engine at\", p)"
            dpkg -s python3-ghee | grep ^Depends'
      - uses: actions/upload-artifact@v4
        with:
          name: python3-ghee-arm64-${{ matrix.dist }}
          path: out/*.deb
      - name: publish to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(dpkg-deb -f out/python3-ghee_*.deb Version | awk '{print $NF}')
          asset="python3-ghee_${ver}_arm64-${{ matrix.dist }}.deb"
          cp out/python3-ghee_*.deb "$asset"
          gh release create "${GITHUB_REF_NAME}" --notes "python3-ghee debs (arm64 bookworm/trixie, armhf ARMv6) and the sdist. Also on PyPI as ghee-render." || true
          gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
