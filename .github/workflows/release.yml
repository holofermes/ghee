name: release-sdist

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the sdist
        run: pipx run build --sdist
      - name: publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" --notes "python3-ghee debs (arm64 bookworm/trixie, armhf ARMv6) and the sdist. Also on PyPI as ghee-render." || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
