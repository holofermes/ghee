name: release-sdist

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the sdist
        run: pipx run build --sdist
      - uses: ./.github/actions/release-notes
        id: notes
      - name: publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" --notes-file "$NOTES" \
            || gh release view "${GITHUB_REF_NAME}" > /dev/null
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
