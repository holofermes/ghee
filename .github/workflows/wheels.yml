name: wheels

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  ZIG_VERSION: 0.16.0

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a workflow_dispatch builds whatever the tree says, dev included
      - name: the tag is the version, and the version is a release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$TAG" = "v$v" || { echo "tag $TAG is not v$v"; exit 1; }
          case $v in *dev*) echo "$v is a dev version: no release builds from it"; exit 1;; esac
      - name: GLES and DRM development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgles2-mesa-dev
      - name: maturin
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install maturin
      - name: build
        run: cd python && maturin build --release --compatibility linux
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-x86_64
          path: python/target/wheels/*.whl

  cross:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-x86_64
          path: template
      - name: zig and cargo-zigbuild
        run: |
          curl -LsS "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-$ZIG_VERSION" >>"$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install cargo-zigbuild
          rustup target add aarch64-unknown-linux-gnu arm-unknown-linux-gnueabihf
      # The armhf repo is the armv6 rebuild the Zero W runs; arm64 is
      # plain Debian. Keep the dist in step with the glibc pins in
      # tools/xwheels.sh.
      - name: sysroots
        run: |
          tools/mksysroot.sh http://raspbian.raspberrypi.com/raspbian trixie armhf sysroots/armv6
          tools/mksysroot.sh http://deb.debian.org/debian trixie arm64 sysroots/aarch64
      - name: build
        run: |
          GHEE_SYSROOTS="$PWD/sysroots" tools/xwheels.sh template/*.whl wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-arm
          path: wheels/*.whl
