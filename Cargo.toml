[package]
name = "ghee"
version = "0.4.1-dev"
edition = "2021"
description = "GLSL scene renderer for headless GPUs. Renders to KMS displays (HDMI, SPI/I2C panels), files, and H264."
license = "MIT"
repository = "https://github.com/holofermes/ghee"

[package.metadata.deb]
maintainer = "holofermes <1163915+holofermes@users.noreply.github.com>"
# cargo-deb takes no manifest key for the Debian version, and it keeps a `-dev`
# version as it stands, which dpkg then sorts after the release. The deb build
# passes --deb-version with the `~` spelling (.github/workflows/release.yml).
# revision drops the `-1` cargo-deb appends otherwise.
revision = ""
section = "graphics"
priority = "optional"
license-file = ["LICENSE", "0"]
depends = "libdrm2, libgbm1, libegl1, libgles2, python3 (>= 3.10)"
conflicts = "python3-ghee"
replaces = "python3-ghee"
# The deb ships the command and the Python package in one. target/pydist
# holds the unpacked wheel for the target arch, and the release workflow
# fills it before cargo-deb runs.
assets = [
    ["target/release/ghee", "usr/bin/", "755"],
    ["target/pydist/**/*", "usr/lib/python3/dist-packages/", "644"],
    ["NOTICE", "usr/share/doc/ghee/", "644"],
    ["ghee/examples/fonts/LICENSE-DejaVu.txt", "usr/share/doc/ghee/", "644"],
    ["ghee/examples/fonts/LICENSE-PixelOperator.txt", "usr/share/doc/ghee/", "644"],
]

[[bin]]
name = "ghee"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# fdsm generates the MTSDF glyph atlas, and its API writes into an image buffer.
fdsm = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false }
# jpeg-decoder and png decode scene assets. output.rs writes PNG itself and
# JPEG through jpeg-encoder. Default features off: jpeg-decoder pulls rayon.
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
# ttf-parser reads the outlines, the metrics and the pair kerning of a text's
# font. The default features stay off, except opentype-layout, which reads
# GPOS, and variable-fonts: ttf-parser reads CFF2 outlines only with it.
# vendor/ holds harfbuzz/ttf-parser main at 0c72912, because release 0.25.1
# outlines no glyph of a CFF2 font without a variation store
# (harfbuzz/ttf-parser#239).
ttf-parser = { path = "vendor/ttf-parser", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }

[build-dependencies]
cc = "1"

[lints.rust]
# A host without a GL device builds the tests with `--cfg ghee_no_gpu`, a host
# without ffmpeg with `--cfg ghee_no_ffmpeg`, and a host whose GL driver
# reports no buffer memory with `--cfg ghee_no_gpu_memory`, which report every
# test that needs one as ignored. A host with a connected display builds them
# with `--cfg ghee_display`, and one with a hardware H264 encoder with
# `--cfg ghee_hw_h264`, which run the tests that need them.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(ghee_no_gpu)",
    "cfg(ghee_no_ffmpeg)",
    "cfg(ghee_no_gpu_memory)",
    "cfg(ghee_display)",
    "cfg(ghee_hw_h264)",
] }

[profile.release]
lto = "thin"
