[package]
name = "ghee"
version = "0.4.1-dev"
edition = "2021"
description = "GLSL scene renderer for headless GPUs. Renders to SPI/I2C panels, KMS scanout, files, and H264."
license = "MIT"
repository = "https://github.com/holofermes/ghee"

[package.metadata.deb]
maintainer = "holofermes <1163915+holofermes@users.noreply.github.com>"
# cargo-deb takes no manifest key for the Debian version, and it keeps a `-dev`
# version as it stands, which dpkg then sorts after the release. The deb build
# passes --deb-version with the `~` spelling (.github/workflows/release.yml).
# revision drops the `-1` cargo-deb appends otherwise.
revision = ""
section = "graphics"
priority = "optional"
depends = "libdrm2, libgbm1, libegl1, libgles2, python3 (>= 3.9)"
conflicts = "python3-ghee"
replaces = "python3-ghee"
# The deb ships the command and the Python package in one. target/pydist
# holds the unpacked wheel for the target arch, and the release workflow
# fills it before cargo-deb runs.
assets = [
    ["target/release/ghee", "usr/bin/", "755"],
    ["target/pydist/**/*", "usr/lib/python3/dist-packages/", "644"],
]

[[bin]]
name = "ghee"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# jpeg-decoder and png decode scene assets only. Encoding stays hand-rolled in
# output.rs and jpeg-encoder. Default features off: jpeg-decoder pulls rayon.
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
png = "0.17"
rppal = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
# ttf-parser reads the outlines and metrics a scene text draws. Default
# features off: a text lays out with the kern table alone.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
