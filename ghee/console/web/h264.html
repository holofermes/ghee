<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ghee h264</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b0c10; color:#c8ccd4; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:10px 14px; border-bottom:1px solid #1c1f27; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px; }
  canvas { width:min(96vw,960px); height:auto; background:#000;
           border:1px solid #1c1f27; border-radius:6px; }
  #stats { display:grid; grid-template-columns:auto auto; gap:2px 16px; font-size:13px; }
  #stats b { color:#7fd1ff; font-weight:600; }
  .k { color:#6b7280; }
  #msg { max-width:640px; padding:10px 12px; border-radius:6px; background:#161922; }
  .err { color:#ff8a8a; }
  .ok { color:#86efac; }
</style>
</head>
<body>
<header><h1>ghee &middot; /h264 &rarr; WebCodecs</h1></header>
<div id="wrap">
  <canvas id="cv" width="320" height="240"></canvas>
  <div id="stats">
    <span class="k">status</span><b id="st">connecting…</b>
    <span class="k">codec</span><b id="codec">—</b>
    <span class="k">decoded</span><b id="frames">0</b>
    <span class="k">fps</span><b id="fps">0</b>
    <span class="k">queue</span><b id="q">0</b>
  </div>
  <div id="msg"></div>
</div>
<script src="h264client.js"></script>
<script>
const $ = id => document.getElementById(id);
const msg = $('msg');
function note(t, cls){ msg.innerHTML = '<span class="'+(cls||'')+'">'+t+'</span>'; }

if (!('VideoDecoder' in window)) {
  $('st').textContent = 'unsupported';
  note('This browser has no WebCodecs <code>VideoDecoder</code> (known case: Firefox on Android). '
     + 'Use the MJPEG console instead.', 'err');
} else {
  if (!window.isSecureContext)
    note('Not a secure context — WebCodecs needs HTTPS or localhost.', 'err');
  attachH264($('cv'), '/h264', {
    onconfig: cfg => { $('codec').textContent = cfg.codec; $('st').textContent = 'streaming';
                       note('decoding ' + cfg.codec + ' (AVCC + description)…', 'ok'); },
    onstats: s => { $('frames').textContent = s.decoded; $('fps').textContent = s.fps;
                    $('q').textContent = s.queue; },
    onfail: e => { $('st').textContent = 'failed'; note(e, 'err'); },
  });
}
</script>
</body>
</html>
