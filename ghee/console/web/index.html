// ---- a scene that a program writes changes its own layers ----
// A drawing adds layers and gives them new looks, and a tick sets their
// fields. /stats counts those changes, and the page reads the scene again
// when the count moves. A layer that the scene changed takes the scene's
// look, its words included. A layer whose card holds the focus or an open
// menu waits for the next read.
let layerChanges = null, following = false;
// a value as JSON with its keys sorted, so two copies of it compare equal
function canon(v){
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
  return JSON.stringify(v);
}
async function followScene(){
  if (following || !work || !work.passes) return;
  following = true;
  const name = active;
  try {
    const fresh = await jget("/scene?name=" + encodeURIComponent(name));
    if (name === active && work && work.passes) takeLayers(fresh);
  } catch (_) {
    layerChanges = null;   // read again at the next poll
  } finally { following = false; }
}
// the layers whose card holds the focus or an open menu
const busyLayers = () => [document.activeElement, menuFrom].map(n => n && n.closest && n.closest("#layers .lay")).filter(Boolean).map(c => c.dataset.name);
function takeLayers(fresh){
  const busy = busyLayers();
  const open = onCommon() ? null : work.passes[curPass], changed = [];
  let relisted = false, waits = false;
  (fresh.passes || []).forEach(fp => {
    const wp = work.passes.find(p => p.name === fp.name);
    if (!wp) return;
    const mine = new Map((wp.layers || []).map(d => [d.name, d]));
    const next = (fp.layers || []).map(f => {
      const d = mine.get(f.name);
      if (d && canon(d) === canon(f)) return d;
      if (d && busy.includes(f.name)){ waits = true; return d; }
      if (wp === open){ if (d) changed.push(f.name); else relisted = true; }
      return clone(f);
    });
    if (wp === open && next.map(d => d.name).join() !== (wp.layers || []).map(d => d.name).join()) relisted = true;
    if (next.length) wp.layers = next; else delete wp.layers;
  });
  if (waits) layerChanges = null;
  if (relisted) relist();
  else changed.forEach(n => recard(open, n));
  if (relisted || changed.length) buildInputs();
}
// The layer list built again. The card under the mouse, else the card at the
// top of the view, stays where it is, so a layer that comes in moves nothing
// under the cursor.
let mouseAt = null;
document.addEventListener("pointermove", e => { if (e.pointerType === "mouse") mouseAt = [e.clientX, e.clientY]; }, {passive: true});
function relist(){
  const card = $(".shadercard"), scrolls = getComputedStyle(card).overflowY === "auto";
  const top = scrolls ? card.getBoundingClientRect().top : 0;
  const cards = [...document.querySelectorAll("#layers .lay")];
  const under = mouseAt && document.elementFromPoint(mouseAt[0], mouseAt[1]);
  const anchor = (under && under.closest("#layers .lay")) || cards.find(c => c.getBoundingClientRect().bottom > top);
  const before = anchor ? anchor.getBoundingClientRect().top : 0, name = anchor ? anchor.dataset.name : null;
  const sideways = new Map(cards.map(c => [c.dataset.name, c.querySelector(".lstrip").scrollLeft]));
  buildLayers();
  const now = [...document.querySelectorAll("#layers .lay")];
  now.forEach(c => { c.querySelector(".lstrip").scrollLeft = sideways.get(c.dataset.name) || 0; });
  const same = now.find(c => c.dataset.name === name);
  if (!same) return;
  const by = same.getBoundingClientRect().top - before;
  if (scrolls) card.scrollTop += by; else scrollBy(0, by);
}
// layer `name` of pass p drawn again in its card
function recard(p, name){
  const d = (p.layers || []).find(x => x.name === name);
  const old = [...document.querySelectorAll("#layers .lay")].find(c => c.dataset.name === name);
  if (!d || !old) return;
  const left = old.querySelector(".lstrip").scrollLeft, next = layerCard(p, d);
  old.replaceWith(next);
  next.querySelector(".lstrip").scrollLeft = left;
  paintMarks();
}

// ---- passes and the common block ----
async function addFilter(name){
  if (!FILTERS[name]) return;
  // name and place only: the server builds the pass from the filter
  work.passes.push({ name: uniqueName(name), fragment: "", channels: [], params: {}, filter: name });
  (work.filters = work.filters || []).push(name);  // save strips the pass, keeps this
  curPass = work.passes.length - 1; await postScene();
  buildPass(); buildParams(); refreshInfo();
}
function addCommon(){
  work.common = "";
  curPass = COMMON; postScene();
  buildPass(); buildParams(); refreshInfo();
}
async function delCommon(){
  if (!await ask("Remove the common block?") || !hasCommon()) return;
  delete work.common;
  if (onCommon()) curPass = 0;
  postScene();
  buildPass(); buildParams(); refreshInfo();
}
function addPass(){
  const name = uniqueName("pass");
  work.passes.push({ name, fragment:"void main(){\n  gl_FragColor = vec4(uv, 0.5, 1.0);\n}\n", arrays:[], channels:[], params:{} });
  curPass = work.passes.length - 1; postScene();
  buildPass(); buildParams(); refreshInfo();
}
async function delPass(i){
  if (work.passes.length <= 1) return;
  const p = work.passes[i], name = p.name, filt = p.filter, n = (p.layers || []).length;
  if (!await ask(`Remove pass ${name}${n > 1 ? ` and its ${n} layers` : n ? " and its layer" : ""}?`) || work.passes[i] !== p) return;
  work.passes.splice(i, 1);
  if (filt && Array.isArray(work.filters)){
    const fi = work.filters.indexOf(filt);
    if (fi >= 0) work.filters.splice(fi, 1);
  }
  work.passes.forEach(q => { q.channels = (q.channels || []).filter(c => c.buffer !== name); });
  // with every pass left hidden, the last shows again: one stays visible
  if (work.passes.every(q => q.visible === false)) delete work.passes[work.passes.length - 1].visible;
  if (curPass >= work.passes.length) curPass = work.passes.length - 1;
  postScene();
  buildPass(); buildParams(); refreshInfo();
}
async function renamePass(i){
  const p = work.passes[i], old = p.name, n = await askName(`Rename pass ${old}`, old);
  if (n == null || n === old || work.passes[i] !== p) return;
  work.passes.forEach(q => (q.channels || []).forEach(c => { if (c.buffer === old) c.buffer = n; }));
  p.name = n; postScene();
  buildPass(); buildParams();
}

// A yes or no in the page's own dialog, resolved true on yes, `remove`
// unless o.yes names it. Focus starts on cancel, Escape and a tap on the
// scrim cancel, Enter says yes, and Tab stays between the two buttons. A
// forced question has two answers and no cancel: focus starts on yes, Enter
// takes the button in focus, and Escape and the scrim do nothing.
let answer = null, askedFrom = null, forced = false;
function ask(question, o = {}){
  $("#askText").textContent = question;
  $("#askYes").textContent = o.yes || "remove";
  $("#askNo").textContent = o.no || "cancel";
  forced = !!o.forced;
  askedFrom = document.activeElement;
  $("#ask").hidden = false;
  (forced ? $("#askYes") : $("#askNo")).focus();
  return new Promise(done => { answer = done; });
}
function answered(yes){
  if (!answer) return;
  const done = answer;
  answer = null;
  $("#ask").hidden = true;
  if (askedFrom && askedFrom.isConnected) askedFrom.focus();
  done(yes);
}
$("#askNo").addEventListener("click", ()=> answered(false));
$("#askYes").addEventListener("click", ()=> answered(true));
$("#ask").addEventListener("click", e=>{ if (e.target === $("#ask") && !forced) answered(false); });
$("#ask").addEventListener("keydown", e=>{
  if (e.key === "Escape"){ e.preventDefault(); if (!forced) answered(false); }
  else if (e.key === "Enter"){ e.preventDefault(); answered(!forced || document.activeElement !== $("#askNo")); }
  else if (e.key === "Tab"){ e.preventDefault(); (document.activeElement === $("#askNo") ? $("#askYes") : $("#askNo")).focus(); }
});

// A new name in the same dialog, resolved null on cancel. Enter takes the name
// once it keeps the rule, Escape and the scrim cancel, and Tab goes round the
// field and the two buttons.
let named = null, nameFrom = null, nameWas = "";
function askName(question, current){
  $("#renText").textContent = question;
  $("#renIn").value = current; nameWas = current;
  $("#renErr").hidden = true;
  nameFrom = document.activeElement;
  $("#ren").hidden = false;
  $("#renIn").focus(); $("#renIn").select();
  return new Promise(done => { named = done; });
}
function nameDone(v){
  if (!named) return;
  const done = named;
  named = null;
  $("#ren").hidden = true;
  if (nameFrom && nameFrom.isConnected) nameFrom.focus();
  done(v);
}
function nameOk(){
  const n = $("#renIn").value.trim(), err = nameError(n, nameWas);
  if (err){ $("#renErr").textContent = err; $("#renErr").hidden = false; return; }
  nameDone(n);
}
$("#renNo").addEventListener("click", () => nameDone(null));
$("#renYes").addEventListener("click", nameOk);
$("#renIn").addEventListener("input", () => { $("#renErr").hidden = true; });
$("#ren").addEventListener("click", e => { if (e.target === $("#ren")) nameDone(null); });
$("#ren").addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.preventDefault(); nameDone(null); }
  else if (e.key === "Enter"){ e.preventDefault(); if (document.activeElement === $("#renNo")) nameDone(null); else nameOk(); }
  else if (e.key === "Tab"){
    e.preventDefault();
    const ring = [$("#renIn"), $("#renNo"), $("#renYes")], k = ring.indexOf(document.activeElement);
    ring[(k + (e.shiftKey ? ring.length - 1 : 1)) % ring.length].focus();
  }
});

const VEC_ARITY = {vec2:2, vec3:3, vec4:4};
const VEC_AXES = ["x","y","z","w"];
// a colour holds "#rrggbb", a CSS colour name or [r,g,b] floats; the native
// input speaks #rrggbb, and the browser's own canvas reads a name
const cssColour = document.createElement("canvas").getContext("2d");
function rgbToHex(rgb){
  if (typeof rgb === "string"){
    cssColour.fillStyle = "#000000";
    cssColour.fillStyle = rgb;
    const c = cssColour.fillStyle;
    return c.startsWith("#") ? c : "#000000";
  }
  const h = x => Math.max(0, Math.min(255, Math.round((+x)*255))).toString(16).padStart(2,"0");
  return "#" + h(rgb[0]) + h(rgb[1]) + h(rgb[2]);
}
// transparent, in any case, which no swatch shows
const clear = c => typeof c === "string" && c.toLowerCase() === "transparent";
// the "none" look of a colour with no swatch, a button that picks one
function noneBtn(title, pick){
  const b = el("button", "clrnone", "none");
  b.type = "button"; b.title = title;
  b.addEventListener("click", pick);
  return b;
}
// A param name is scene data: it only ever reaches the DOM as text or as an
// input property, never as markup.
function paramLabel(row, name, readout, mark){
  const lab = el("label");
  lab.appendChild(mark(el("span", null, name)));
  const val = readout == null ? null : el("span", "val", readout);
  if (val) lab.appendChild(val);
  row.appendChild(lab);
  return val;
}
function slider(mn, mx, step, value){
  const inp = el("input");
  inp.type = "range"; inp.min = mn; inp.max = mx; inp.step = step; inp.value = value;
  return inp;
}
// One control per param, for both scopes. `pass` is the name of the pass that
// holds the param, null for a scene param.
function buildParamRow(box, pm, name, pass){
  const scene = active, at = pass == null ? "" : `pass=${enc(pass)}&`;
  const send = value => setParam(scene, `${at}name=${enc(name)}&value=${enc(value)}`);
  // the param's key, marked while its value differs from the default's
  const mark = key => markKey(key, () => has(pass == null ? (E.values || {}).params : (passEdit(pass) || {}).params, name), () => {
    const q = pass == null ? D : defPass(pass), dp = q && (q.params || {})[name];
    if (!dp) return;
    pm.value = clone(dp.value);
    send(Array.isArray(pm.value) ? pm.value.join(",") : String(pm.value));
    buildParams();
  });
  const row = el("div", "row");
  if (pm.type === "string"){
    // host-side value (the scene controller consumes it): dropdown when the
    // param declares options, free text otherwise
    paramLabel(row, name, null, mark);
    const set = v => { pm.value = v; send(v); };
    if (Array.isArray(pm.options) && pm.options.length){
      const sel = el("select", "strsel");
      const opts = pm.options.includes(pm.value) ? pm.options : pm.options.concat([pm.value]);
      opts.forEach(o => { const op = el("option", null, o); op.value = o; sel.appendChild(op); });
      sel.value = pm.value;
      sel.addEventListener("change", ()=> set(sel.value));
      row.appendChild(sel);
    } else {
      // free text runs over several lines, the box shows up to 8 of them
      const inp = el("textarea", "strinp");
      const fit = () => { inp.rows = Math.min(8, Math.max(2, inp.value.split("\n").length)); };
      inp.value = pm.value; fit();
      let t = null;
      inp.addEventListener("input", ()=>{ fit(); clearTimeout(t); t = setTimeout(()=> set(inp.value), 300); });
      inp.addEventListener("change", ()=>{ clearTimeout(t); set(inp.value); });
      row.appendChild(inp);
    }
    box.appendChild(row);
    return;
  }
  if (pm.type === "bool"){
    // true/false on the wire, never 1/0: the scene model demands a real bool
    const lab = el("label", "boolrow");
    lab.appendChild(mark(el("span", null, name)));
    const inp = el("input", "boolbox");
    inp.type = "checkbox";
    inp.checked = !!pm.value;
    inp.addEventListener("change", ()=>{
      pm.value = inp.checked;
      send(inp.checked ? "true" : "false");
    });
    lab.appendChild(inp);
    row.appendChild(lab);
    box.appendChild(row);
    return;
  }
  if (pm.type === "color"){
    paramLabel(row, name, null, mark);
    const inp = el("input");
    inp.type = "color"; inp.value = rgbToHex(pm.value);
    inp.setAttribute("aria-label", name);
    inp.addEventListener("input", ()=>{
      pm.value = inp.value;
      send(inp.value);
    });
    if (clear(pm.value)){
      const none = noneBtn("pick a colour", () => {
        none.replaceWith(inp);
        try { inp.showPicker(); } catch (e) {}
      });
      row.appendChild(none);
    } else row.appendChild(inp);
    box.appendChild(row);
    return;
  }
  // vec2: a direction pad (drag = direction + magnitude, works with touch),
  // a magnitude slider that keeps direction, and numeric entry. All three
  // views of one vector; every change sends the full value.
  if (pm.type === "vec2"){
    const mn = pm.min!=null?pm.min:-1, mx = pm.max!=null?pm.max:1;
    const R = Math.max(Math.abs(mn), Math.abs(mx)) || 1;
    const st = pm.step!=null?pm.step:R/100;
    const val = paramLabel(row, name, "", mark);
    const wrap = el("div", "vecwrap");
    const pad = el("div", "vecpad");
    pad.innerHTML =
      `<svg viewBox="0 0 84 84">
         <line x1="42" y1="42" x2="42" y2="42" stroke="currentColor" stroke-width="2"/>
         <circle cx="42" cy="42" r="3.5" fill="currentColor"/>
       </svg>`;
    const col = el("div", "veccol");
    const mag = slider(0, R, st, 0); mag.className = "vmag";
    const nums = el("div", "vnums");
    const number = () => {
      const i = el("input");
      i.type = "number"; i.step = st; i.min = mn; i.max = mx;
      nums.appendChild(i);
      return i;
    };
    const nx = number(), ny = number();
    col.appendChild(mag); col.appendChild(nums);
    wrap.appendChild(pad); wrap.appendChild(col);
    row.appendChild(wrap);
    const svg = pad.querySelector("svg");
    const ln = svg.querySelector("line"), dot = svg.querySelector("circle");
    const clampC = v => Math.min(mx, Math.max(mn, v));
    const sync = () => {
      const [x, y] = pm.value;
      const px = 42 + (x / R) * 36, py = 42 - (y / R) * 36;
      ln.setAttribute("x2", px); ln.setAttribute("y2", py);
      dot.setAttribute("cx", px); dot.setAttribute("cy", py);
      mag.value = Math.hypot(x, y);
      nx.value = (+x).toFixed(3); ny.value = (+y).toFixed(3);
      val.textContent = `${(+x).toFixed(3)}, ${(+y).toFixed(3)}`;
    };
    const push = () => send(pm.value.map(x=>(+x).toFixed(3)).join(","));
    const fromPad = ev => {
      const b = pad.getBoundingClientRect();
      const x = ((ev.clientX - b.left) / b.width * 2 - 1) * R;
      const y = -((ev.clientY - b.top) / b.height * 2 - 1) * R;
      pm.value = [clampC(x), clampC(y)];
      sync(); push();
    };
    pad.addEventListener("pointerdown", ev => {
      pad.setPointerCapture(ev.pointerId); fromPad(ev); ev.preventDefault();
    });
    pad.addEventListener("pointermove", ev => {
      if (ev.buttons) fromPad(ev);
    });
    mag.addEventListener("input", () => {
      const [x, y] = pm.value;
      const len = Math.hypot(x, y);
      const d = len > 1e-6 ? [x/len, y/len] : [1, 0];
      const m = parseFloat(mag.value);
      pm.value = [clampC(d[0]*m), clampC(d[1]*m)];
      sync(); push();
    });
    [nx, ny].forEach((inp, c) => inp.addEventListener("change", () => {
      pm.value[c] = clampC(parseFloat(inp.value) || 0);
      sync(); push();
    }));
    box.appendChild(row);
    sync();
    return;
  }
  // vec3/vec4 travel as K floats; render K slider rows (name.x/.y/.z/.w)
  // sharing the param's scalar min/max/step, each edit sending the vector.
  if (VEC_ARITY[pm.type]){
    const n = VEC_ARITY[pm.type];
    const mn = pm.min!=null?pm.min:0, mx = pm.max!=null?pm.max:1;
    const step = pm.step!=null?pm.step:(mx-mn)/200;
    for (let c=0;c<n;c++){
      const r = el("div", "row");
      const val = paramLabel(r, name + "." + VEC_AXES[c], (+pm.value[c]).toFixed(3), mark);
      const inp = slider(mn, mx, step, pm.value[c]);
      inp.addEventListener("input", ()=>{
        const v = parseFloat(inp.value);
        pm.value[c] = v; val.textContent = v.toFixed(3);
        send(pm.value.map(x=>(+x).toFixed(3)).join(","));
      });
      r.appendChild(inp);
      box.appendChild(r);
    }
    return;
  }
  const mn = pm.min!=null?pm.min:0, mx = pm.max!=null?pm.max:1;
  const step = pm.type==="int" ? 1 : (pm.step!=null?pm.step:(mx-mn)/200);
  const fmt = v => pm.type==="int" ? (v|0) : (+v).toFixed(3);
  const val = paramLabel(row, name, fmt(pm.value), mark);
  const inp = slider(mn, mx, step, pm.value);
  inp.addEventListener("input", ()=>{
    const v = pm.type==="int" ? parseInt(inp.value,10) : parseFloat(inp.value);
    pm.value = v; val.textContent = fmt(v);
    send(v);
  });
  row.appendChild(inp);
  box.appendChild(row);
}

function buildParams(){
  const box = $("#params"); box.innerHTML = "";
  let any = false;
  const paramNames = obj => Object.keys(obj||{}).filter(n => ["float","int","bool","color","vec2","vec3","vec4","string"].includes(obj[n].type));
  const sceneParams = work.params || {};
  // a text layer's words have their box on the layer
  const words = new Set(textLayers().map(d => d.name));
  const sceneNames = paramNames(sceneParams).filter(n => !words.has(n));
  // header the groups once there is more than one: the SCENE group plus any
  // pass that owns params
  const passGroups = work.passes.filter(p => paramNames(p.params).length).length;
  const grouped = (sceneNames.length ? 1 : 0) + passGroups > 1;
  if (sceneNames.length){
    if (grouped) box.appendChild(el("div", "pgroup", "scene"));
    sceneNames.forEach(name=>{ buildParamRow(box, sceneParams[name], name, null); any = true; });
  }
  work.passes.forEach(p=>{
    const names = paramNames(p.params);
    if (!names.length) return;
    const from = box.children.length;
    if (grouped) box.appendChild(el("div", "pgroup", (p.filter ? "ƒ " : "") + p.name));
    names.forEach(name=>{ buildParamRow(box, p.params[name], name, p.name); any = true; });
    // a hidden pass keeps its params, dimmed as its tab is
    if (p.visible === false) [...box.children].slice(from).forEach(c => c.classList.add("off"));
  });
  if (!any){ box.innerHTML = `<div class="muted">no parameters</div>`; }
  paintMarks();
}

// The server refuses a scene it cannot build, and the refusal shows until a
// posted scene builds.
let postErr = "";
// A scene that is still loading answers 503, and the post goes again.
async function postScene(){
  const name = active;
  const r = await edit("/scene", name, "name=" + enc(name), JSON.stringify(work));
  if (!r || r.status === 409 || r.status === 412) return;
  if (r.status === 503){ rebuildSoon(); return; }
  if (r.ok){ postErr = ""; adoptFilters(await r.json()); }
  else postErr = await r.text();
  showErrors();
}
// A live value for scene `scene`, the one this page showed when it built the
// control.
function setParam(scene, q){ edit("/set", scene, `scene=${enc(scene)}&${q}`); }
// The server refuses an edit for scene `from` once the console is on another
// scene. The page then shows that scene as it runs, and posts nothing, so it
// overwrites no edit made elsewhere.
let moving = false;
async function sceneMoved(from){
  if (moving || from !== active) return;
  moving = true;
  try {
    clearTimeout(compileTimer); compileTimer = null;
    const s = await jget("/scenes");
    procedural = s.procedural;
    await loadScene(s.active, false);
    const n = $("#moved");
    n.textContent = `the console switched to ${s.active}, so this edit to ${from} was not applied`;
    n.hidden = false;
  } finally { moving = false; }
}
$("#moved").addEventListener("click", ()=>{ $("#moved").hidden = true; });

// A filter pass is the server's: take its fragment and channels as the server
// built them, and any param it added. Values already here stay.
function adoptFilters(doc){
  (doc.passes||[]).forEach(d => {
    if (!d.filter) return;
    const p = work.passes.find(w => w.name === d.name && w.filter === d.filter);
    if (!p) return;
    p.fragment = d.fragment; p.channels = d.channels || [];
    const params = {};
    Object.entries(d.params||{}).forEach(([n, v]) => { params[n] = (p.params||{})[n] || v; });
    p.params = params;
  });
}

// Save writes the working copy's edits to the scene's state file on the
// device.
$("#save").addEventListener("click", async ()=>{
  const name = active, b = $("#save");
  const r = await edit("/save", name, "name=" + enc(name));
  if (!r || !r.ok){
    if (r && r.status !== 409 && r.status !== 412){ postErr = await r.text(); showErrors(); }
    return;
  }
  b.textContent = "saved"; setTimeout(()=>{ b.textContent = "save"; }, 1200);
});
// back to defaults asks first, and its label never changes

  const name = active;
  if (!hasEdits() || !await ask(`Take ${name} back to its defaults? Every edit goes.`, {yes: "back to defaults"}) || name !== active) return;
  const r = await edit("/reset", name, "name=" + enc(name));
  if (r && r.ok) await refresh(true);
  else if (r && r.status !== 409 && r.status !== 412){ postErr = await r.text(); showErrors(); }
});

// column resize (desktop): drag the grip, width persists per browser
(function(){
  const grip = $("#colgrip"), grid = document.querySelector(".grid");
  const saved = parseInt(localStorage.getItem("ghee:leftw"), 10);
  // the passes card keeps room for its own minimum beside the dragged width
  const leftw = w => grid.style.setProperty("--leftw", `min(${w}px, calc(100% - 340px))`);
  if (saved) leftw(saved);
  let dragging = false, w = saved || 0;
  grip.addEventListener("pointerdown", e=>{
    dragging = true; grip.classList.add("drag"); grip.setPointerCapture(e.pointerId); e.preventDefault();
  });
  grip.addEventListener("pointermove", e=>{
    if (!dragging) return;
    w = Math.min(720, Math.max(320, Math.round(e.clientX - grid.getBoundingClientRect().left)));
    leftw(w);
  });
  grip.addEventListener("pointerup", e=>{
    dragging = false; grip.classList.remove("drag"); grip.releasePointerCapture(e.pointerId);
    if (w) localStorage.setItem("ghee:leftw", String(w));
  });
})();

// touch: tap the stream to reveal the overlay controls, auto-fade after idle
(function(){
  const scr = document.querySelector(".screen");
  let t = null;
  const hide = ()=>{
    if (document.querySelector(".infowrap.open")){ t = setTimeout(hide, 1500); return; }
    scr.classList.remove("controls");
  };
  scr.addEventListener("pointerdown", ()=>{
    if (window.matchMedia("(hover:hover)").matches) return;   // mouse devices use :hover
    scr.classList.add("controls");
    clearTimeout(t); t = setTimeout(hide, 2500);
  });
})();

// preview controls
$("#muteBtn").addEventListener("click", ()=>{
  streamMuted = !streamMuted;
  localStorage.setItem(STREAM_KEY, streamMuted ? "muted" : "live");
  applyMuted();
  if (streamMuted) stopStream(); else startStream();
});
applyMuted();
$("#rotBtn").addEventListener("click", ()=>{
  localStorage.setItem("ghee:rotation", String((effectiveRotation()+90)%360));
  applyRotation(); refreshInfo();
});
$("#pipBtn").addEventListener("click", openPip);
$("#fsBtn").addEventListener("click", toggleFullscreen);
// the tiny-frame menu drives the overlay buttons it replaces
const MINI = $("#miniBtn"), OVMENU = $("#ovMenu");
function closeMini(){ OVMENU.classList.remove("open"); MINI.setAttribute("aria-expanded","false"); }
function syncMini(){
  for (const row of OVMENU.querySelectorAll("button[data-for]")) {
    const src = $("#" + row.dataset.for);
    row.hidden = src.hidden;
    if (row.dataset.for === "muteBtn") {
      row.querySelector(".ic").innerHTML = src.innerHTML;
      row.querySelector("span:last-child").textContent = src.title;
    }
  }
}
MINI.addEventListener("click", e => {
  e.stopPropagation();
  syncMini();
  const open = !OVMENU.classList.contains("open");
  OVMENU.classList.toggle("open", open);
  MINI.setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => { if (!OVMENU.contains(e.target)) closeMini(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMini(); });
for (const row of OVMENU.querySelectorAll("button[data-for]")) {
  // the row's own click keeps travelling to the document, which closes every
  // popover: a row that opens one would open it and lose it in one dispatch
  row.addEventListener("click", e => {
    e.stopPropagation();
    closeMini();
    $("#" + row.dataset.for).click();
  });
}
document.addEventListener("fullscreenchange", ()=>{ applyRotation(); syncPopOut(); });
addEventListener("resize", applyRotation);
syncPopOut();
$("#infoBtn").addEventListener("click", e=>{ e.stopPropagation(); $("#infoBtn").closest(".infowrap").classList.toggle("open"); });
$("#infoPop").addEventListener("click", e=>{
  e.stopPropagation();   // taps inside the popover keep it open (mobile has no hover)
  if (e.target.closest("[data-act=rotate]")){
    localStorage.setItem("ghee:rotation", String((effectiveRotation()+90)%360));
    applyRotation(); refreshInfo();
  }
});
document.addEventListener("click", ()=>{
  $("#infoBtn").closest(".infowrap").classList.remove("open");
  closeMenus();
});

// add parameter
$("#addToggle").addEventListener("click", ()=> $("#addRow").classList.toggle("show"));
$("#pAdd").addEventListener("click", ()=>{
  const name = $("#pName").value.trim(); if(!name) return;
  const type = $("#pType").value;
  // "scene" writes into the working scene's top-level params (every pass);
  // "this pass" keeps the current pass-scoped behavior
  const into = $("#pPlace").value === "scene"
    ? (work.params = work.params || {})
    : (work.passes[curPass].params = work.passes[curPass].params || {});
  if (type === "string"){
    into[name] = {type:"string", value:$("#pVal").value};
  } else if (type === "bool"){
    into[name] = {type:"bool", value:false};
  } else if (type === "color"){
    into[name] = {type:"color", value:"#ffffff"};
  } else if (VEC_ARITY[type]){
    into[name] = {type, value:Array(VEC_ARITY[type]).fill(0), min:parseFloat($("#pMin").value)||0, max:parseFloat($("#pMax").value)||1};
  } else {
    into[name] = {type, value:parseFloat($("#pVal").value)||0, min:parseFloat($("#pMin").value)||0, max:parseFloat($("#pMax").value)||1};
  }
  $("#pName").value=""; $("#addRow").classList.remove("show");
  buildParams(); postScene();
});

// A refused post shows first, then the running scene's compile error, then
// the problems of its text layers. A compile error in the open pass opens its
// shader once, and its line marks the editor.
let errOpened = "";
function showErrors(){
  const s = lastStats || {}, e = $("#err");
  const msg = postErr || s.error || (s.text_errors || []).join("\n");
  e.textContent = msg; e.classList.toggle("show", !!msg);
  const inPass = !postErr && s.error && s.error_pass != null && s.error_pass === curPass;
  if (!s.error) errOpened = "";
  else if (inPass && errOpened !== s.error + "\n" + curPass){
    errOpened = s.error + "\n" + curPass;
    if (!shaderShown()){ errOpen = curPass; paintShader(); }
  }
  const here = !postErr && s.error && s.error_line && (s.error_pass == null || s.error_pass === curPass);
  CODE.mark(here ? s.error_line : 0);
}

// The usage figures cost the server file reads, so the page asks for them
// only while the render info shows. gpu_busy covers the time since the last
// request that asked, so the first answer after the panel opens has none.
const infoShown = () => {
  const w = $("#infoBtn").closest(".infowrap");
  return w.classList.contains("open") || w.matches(":hover");
};
// A poll gives up on an answer after 5 s, and the next poll always follows.
// With no edit of this page's in flight, a revision that moved past the one
// this page accounts for reads the scene again. The stale refusal's notice
// holds the page as it is until its tap.
let askedUsage = false;
const POLL_WAIT_MS = 5000;
async function poll(){
  const stop = new AbortController(), t = setTimeout(() => stop.abort(), POLL_WAIT_MS);
  try{
    const asking = infoShown();
    const s = await (await fetch(asking ? "/stats?usage=1" : "/stats", {signal: stop.signal})).json();
    if (asking && !askedUsage && s.gpu_busy) Object.keys(s.gpu_busy).forEach(q => { s.gpu_busy[q] = null; });
    askedUsage = asking;
    pollFails = 0;
    staleScene = !!s.stale;
    lastStats = s;
    if (s.display) lastDisplay = s.display;
    if (s.layer_changes !== layerChanges){
      layerChanges = s.layer_changes;
      if (isProcedural()) followScene();
    }
    if (s.rev != null && known != null && s.rev !== known && s.active === active && settled() && $("#behind").hidden) refresh();
    refreshInfo(); applyRotation(); showErrors();
  }catch(_){ pollFails++; }
  finally {
    clearTimeout(t);
    showNotices();
    setTimeout(poll, 600);
  }
}

function applyTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem("ghee:theme", t);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t==="dark"?"#141518":"#f3f3f1");
  $("#theme").textContent = t==="dark" ? "☀" : "☾";
}
applyTheme(document.documentElement.dataset.theme || "light");
$("#theme").addEventListener("click", ()=> applyTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark"));

if ("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
boot();
</script>
