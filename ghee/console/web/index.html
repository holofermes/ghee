<script>(function(){try{var t=localStorage.getItem("ghee:theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
  :root{
    --bg:#f3f3f1; --panel:#fbfbfa; --line:#e6e6e2; --ink:#1d1d1b; --muted:#8a8a83;

    --t-cm:#a2a298; --t-pp:#8a5fb0; --t-ty:#2c7a72; --t-kw:#b0603a; --t-bi:#3f63ad; --t-nu:#86772f;
    --err-bg:#fdf0ef; --err-line:#f3d4d0;
    --warn:#8a5a12; --warn-bg:#fbf1de; --warn-line:#ecd9ae;
    --mod:#9a5b00;
    --shadow:0 1px 2px rgba(20,20,16,.05), 0 6px 20px rgba(20,20,16,.05);
    --scrim:rgba(20,20,16,.32);
    --r:12px;
  }
  html[data-theme="dark"]{
    --bg:#141518; --panel:#1c1e22; --line:#2b2e34; --ink:#e9e9e4; --muted:#888b92;
    --well:#14161c;
    --accent:#e9e9e4; --accent-ink:#16171a; --hot:#e0796f; --live:#5fcf78;
    --code-bg:#17181c; --code-ink:#cacac3; --bezel:#2c2f36; --scroll:#3a3e46;
    --t-cm:#6f7178; --t-pp:#b89ce0; --t-ty:#5bbdb0; --t-kw:#e0916a; --t-bi:#80a1e0; --t-nu:#c4b56a;
    --err-bg:#2a1a18; --err-line:#5a322c;
    --warn:#e7c078; --warn-bg:#2b2214; --warn-line:#4e3d1e;
    --mod:#e6a94a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; overscroll-behavior-x:none}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; height:100vh; display:flex; flex-direction:column; overflow:hidden;
    padding:max(18px,env(safe-area-inset-top)) 18px 18px;
  }
  header{display:flex; align-items:center; gap:10px 12px; margin:0 2px 16px; flex-wrap:wrap; flex:0 0 auto; white-space:nowrap}
  .brand{font-weight:650; letter-spacing:.2px; font-size:16px}
  .brand .dot{color:var(--muted); font-weight:400}
  .spacer{flex:1}
  select,button,input{font:inherit; color:var(--ink)}
  select{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 28px 7px 11px; box-shadow:var(--shadow); cursor:pointer;
    appearance:none; -webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  button{
    background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 12px;
    cursor:pointer; box-shadow:var(--shadow); transition:transform .04s ease, background .15s ease;
  }
  button:hover{border-color:var(--muted)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4; cursor:default; box-shadow:none}
  button:disabled:hover{border-color:var(--line)}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  button.ghost{box-shadow:none; background:transparent; border-color:transparent; color:var(--muted)}
  button.ghost:hover{color:var(--ink); border-color:transparent}
  #theme{font-size:20px; line-height:1; padding:3px 9px; color:var(--ink)}
  .notice{padding:7px 12px; border-radius:9px; font-size:13px; white-space:nowrap;
    background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn); box-shadow:none}
  button.notice:hover{border-color:var(--warn)}
  .notice.bad{background:var(--err-bg); border-color:var(--err-line); color:var(--hot)}
  #moved, #behind{white-space:normal; text-align:left}
  .nav{display:flex; align-items:center; gap:4px}
  .nav .step{font-size:18px; line-height:1; padding:4px 9px; color:var(--muted)}
  .actions{display:flex; gap:7px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
  .grid{display:grid; grid-template-columns:var(--leftw, minmax(260px,440px)) 6px minmax(320px,1fr); gap:6px; flex:1 1 auto; min-height:0}
  .colgrip{cursor:col-resize; border-radius:3px; align-self:stretch}
  .colgrip:hover,.colgrip.drag{background:var(--line)}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
  .leftcol{display:flex; flex-direction:column; gap:18px; overflow-y:auto; overflow-x:hidden; min-height:0; padding-right:4px}
  .stage{padding:14px; flex:0 0 auto; position:sticky; top:0; z-index:5}
  .screen .infowrap{position:absolute; top:16px; left:16px; z-index:7}
  .screen .ovtools{position:absolute; top:16px; right:16px; z-index:7; display:flex; gap:6px}
  .ovbtn{width:26px; height:26px; padding:0; display:inline-flex; align-items:center; justify-content:center;
    font-size:14px; line-height:1; color:#e9e9e4; background:rgba(8,9,11,.45); border:0; border-radius:8px;
    box-shadow:none; backdrop-filter:blur(3px)}
  .ovbtn:hover{background:rgba(8,9,11,.68); border:0}
  .ovbtn[hidden]{display:none}
  @media (pointer:coarse){ .ovbtn{width:40px; height:40px; font-size:18px; border-radius:10px} .screen .ovtools{gap:8px} }
  /* overlay controls stay off the art: hover reveals on mouse devices, a tap
     reveals on touch (.controls, set in js), an open popover pins them */
  .screen .infowrap, .screen .ovtools{opacity:0; visibility:hidden; transition:opacity .18s ease, visibility .18s ease}
  @media (hover:hover){ .screen:hover .infowrap, .screen:hover .ovtools{opacity:1; visibility:visible} }
  .screen.controls .infowrap, .screen.controls .ovtools, .screen .infowrap.open{opacity:1; visibility:visible}
  /* a stopped stream holds its control on screen */
  .screen.muted .ovtools{opacity:1; visibility:visible}
  .screen.muted .frame{opacity:.35}
  /* a tiny frame trades the toolbar for one menu: five buttons would blanket
     the pixels. applyRotation sets .tiny from the fitted frame size. */
  .screen .minitrig{display:none; position:absolute; top:14px; right:14px; z-index:8;
    width:22px; height:22px; padding:0; font-size:14px; line-height:1;
    align-items:center; justify-content:center; border:0; border-radius:6px;
    background:rgba(8,9,11,.55); color:#dfe3ea; cursor:pointer;
    opacity:0; visibility:hidden; transition:opacity .18s ease, visibility .18s ease}
  .screen .minitrig span{transform:translateY(-1px)}
  .screen .minitrig:hover{background:rgba(8,9,11,.85)}
  .screen.tiny .minitrig{display:inline-flex}
  .screen.tiny .ovtools, .screen.tiny .infowrap .ovbtn{display:none}
  @media (hover:hover){ .screen.tiny:hover .minitrig{opacity:1; visibility:visible} }
  .screen.tiny.controls .minitrig, .screen.tiny.muted .minitrig,
  .screen.tiny .minitrig[aria-expanded="true"]{opacity:1; visibility:visible}
  .screen .ovmenu{display:none; position:absolute; top:40px; right:14px; z-index:9;
    min-width:170px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.35); padding:5px}
  .screen .ovmenu.open{display:block}
  .screen .ovmenu button{display:flex; gap:10px; align-items:center; width:100%;
    padding:7px 10px; background:none; border:0; color:var(--ink); font-size:13px;
    border-radius:7px; cursor:pointer; text-align:left}
  .screen .ovmenu button:hover{background:var(--well)}
  .screen .ovmenu button[hidden]{display:none}
  .screen .ovmenu .ic{width:18px; display:inline-flex; justify-content:center; color:var(--muted)}
  @media (pointer:coarse){
    .screen .minitrig{width:40px; height:40px; font-size:18px; border-radius:10px}
    .screen .ovmenu{top:58px}
    .screen .ovmenu button{padding:11px 12px; font-size:14px}
  }
  /* the preview node lives in the pop-out window: hold its footprint so the
     column does not collapse while it is away */
  .screen .popped{display:flex; align-items:center; justify-content:center; margin:0 auto;
    background:var(--well); border-radius:4px; color:var(--muted); text-align:center;
    font:12px ui-monospace,Menlo,monospace; padding:8px}
  .screen .popped[hidden]{display:none}
  .screen:fullscreen{padding:0; border-radius:0; background:#000; display:flex; align-items:center; justify-content:center}
  .shadercard{display:flex; flex-direction:column; min-height:0; min-width:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--scroll) transparent}
  .shadercard .editor{flex:0 0 auto; min-height:140px; margin-top:6px}
  /* the common block and a filter show their shader alone, filling the card */
  .shadercard.solo .editor{flex:1 0 auto; margin-top:0}
  .shadercard .err{flex:0 0 auto}
  .errmark{position:absolute; left:0; right:0; background:rgba(192,57,43,.16); border-left:3px solid var(--hot); pointer-events:none; display:none; z-index:1}
  .screen{position:relative; background:var(--bezel); border-radius:12px; padding:12px; width:max-content; max-width:100%; margin:0 auto}
  .frame{position:relative; margin:0 auto; overflow:hidden; max-width:100%}
  .vecwrap{display:flex; gap:10px; align-items:center; margin:2px 0 6px}
  .vecpad{width:84px; height:84px; border-radius:50%; background:var(--well);
          border:1px solid var(--line); position:relative; touch-action:none;
          flex:none; cursor:crosshair}
  .vecpad svg{position:absolute; inset:0; pointer-events:none}
  .veccol{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0}
  .vnums{display:flex; gap:6px}
  .vnums input{width:100%; min-width:0; background:var(--well);
               border:1px solid var(--line); color:inherit; border-radius:4px;
               font:inherit; font-size:11px; padding:2px 4px}
  .row .strinp, .row .strsel{width:100%; min-width:0; background:var(--well);
               border:1px solid var(--line); color:inherit; border-radius:4px;
               font:inherit; font-size:12px; padding:4px 6px}
  textarea.strinp{display:block; margin:0; resize:vertical; line-height:1.4}
  /* bool: the switch lives inside the label so the whole row is a tap target */
  .row label.boolrow{align-items:center; gap:12px; cursor:pointer; min-height:22px}
  .boolbox{-webkit-appearance:none; appearance:none; flex:none; margin:0; position:relative;
           width:36px; height:20px; border:1px solid var(--line); border-radius:999px;
           background:var(--well); cursor:pointer; transition:background .12s ease, border-color .12s ease}
  .boolbox::after{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px;
           border-radius:50%; background:var(--muted); transition:transform .12s ease, background .12s ease}
  .boolbox:checked{background:var(--accent); border-color:var(--accent)}
  .boolbox:checked::after{transform:translateX(16px); background:var(--accent-ink)}
  .boolbox:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .frame img, .frame canvas{position:absolute; top:50%; left:50%; display:block}
  .frame.crisp img, .frame.crisp canvas{image-rendering:pixelated}
  .iconbtn{font-size:16px; line-height:1; padding:4px 9px; color:var(--muted); border-radius:8px}
  .iconbtn:hover{color:var(--ink); background:var(--code-bg); border-color:var(--line)}
  .infowrap{position:relative}
  .infopop{position:absolute; top:calc(100% + 8px); left:0; min-width:236px; background:var(--panel);
    border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow); padding:11px 13px;
    opacity:0; visibility:hidden; transform:translateY(-4px); transition:opacity .12s ease, transform .12s ease; z-index:6}
  .infowrap:hover .infopop, .infowrap.open .infopop{opacity:1; visibility:visible; transform:none}
  .ipsect + .ipsect{margin-top:9px; padding-top:9px; border-top:1px solid var(--line)}
  .iphead{font:10px ui-monospace,Menlo,monospace; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-bottom:5px}
  .iprow{display:flex; justify-content:space-between; gap:20px; font:12px ui-monospace,Menlo,monospace; padding:2px 0; color:var(--ink)}
  .iprow .k{color:var(--muted)}
  .iprow.off .v{color:var(--muted)}
  .card{padding:14px 16px}
  .card + .card{margin-top:16px}
  h3{margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600}
  .row{display:grid; grid-template-columns:1fr; gap:5px; margin:11px 0}
  .row label{display:flex; justify-content:space-between; font-size:13px; color:var(--accent)}
  .row .val{color:var(--muted); font:12px ui-monospace,Menlo,monospace}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:3px; background:var(--line); border-radius:3px; outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:var(--shadow); margin-top:0}
  input[type=range]::-moz-range-thumb{width:15px; height:15px; border:none; border-radius:50%; background:var(--accent); cursor:pointer}
  /* touch: fat thumbs, edge clearance so drags stay off the browser's
     back-swipe zone, and no history navigation from horizontal overscroll */
  @media (pointer:coarse){
    input[type=range]{height:6px}
    input[type=range]::-webkit-slider-thumb{width:28px; height:28px}
    input[type=range]::-moz-range-thumb{width:28px; height:28px}
    .row{padding:4px 8px}
    .leftcol{padding-left:8px; padding-right:12px}
    .vecpad{width:116px; height:116px}
    .vnums input, .row .strinp, .row .strsel{font-size:14px; padding:7px 8px}
    .boolbox{width:50px; height:30px}
    .boolbox::after{width:22px; height:22px; top:3px; left:3px}
    .boolbox:checked::after{transform:translateX(20px)}
    .notice{padding:11px 14px}
  }
  input[type=color]{-webkit-appearance:none; appearance:none; width:100%; height:22px; padding:0; border:1px solid var(--line); border-radius:8px; background:var(--panel); cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:none; border-radius:6px}
  input[type=color]::-moz-color-swatch{border:none; border-radius:6px}
  /* an editor grows with its code: the highlighted copy sits in the flow
     and sizes the box, the textarea covers the box and never scrolls */
  .editor{position:relative; border:1px solid var(--line); border-radius:9px; background:var(--code-bg); overflow:hidden}
  .editor>pre,.editor>textarea{margin:0; border:0; padding:11px; font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:2; white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word}
  .editor>pre{position:relative; color:var(--code-ink); pointer-events:none}
  .editor>textarea{position:absolute; inset:0; display:block; width:100%; height:100%; resize:none; background:transparent; color:transparent; caret-color:var(--ink); outline:none; overflow:hidden}
  .leftcol{scrollbar-width:none}
  .leftcol::-webkit-scrollbar{display:none}
  .shadercard::-webkit-scrollbar{width:10px}
  .shadercard::-webkit-scrollbar-track{background:transparent}
  .shadercard::-webkit-scrollbar-thumb{background:var(--scroll); border-radius:8px; border:2px solid transparent; background-clip:padding-box}
  .t-cm{color:var(--t-cm); font-style:italic} .t-pp{color:var(--t-pp)} .t-ty{color:var(--t-ty)}
  .t-kw{color:var(--t-kw)} .t-bi{color:var(--t-bi)} .t-nu{color:var(--t-nu)}
  .toolbar{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}
  .err{margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--err-bg); border:1px solid var(--err-line); color:var(--hot); font:12px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; display:none}
  .err.show{display:block}
  /* a long editor scrolls, and its error stays in sight at the bottom */
  .shadercard .err{position:sticky; bottom:0; z-index:3; box-shadow:var(--shadow)}
  .addparam{display:none; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center}
  .addparam.show{display:flex}
  .addparam input{background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; width:78px}
  .addparam input.name{width:130px}
  .muted{color:var(--muted); font-size:12px}
  /* the tab row stays where it is while the card scrolls under it */
  .passhead{position:sticky; top:-14px; z-index:4; margin:-14px -16px 0; padding:14px 16px 14px; background:var(--panel); border-radius:var(--r) var(--r) 0 0}
  /* the line under the tabs is the row's own, so the strip that scrolls them
     neither clips it nor fades it */
  .tabs{display:flex; align-items:flex-end; box-shadow:inset 0 -1px 0 var(--line); flex:0 0 auto}
  .tstrip{flex:0 1 auto; align-items:flex-end; gap:2px}
  .tab{display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 12px; border:0; border-bottom:2px solid transparent; border-radius:7px 7px 0 0; background:transparent; cursor:pointer; font-size:13px; color:var(--muted); user-select:none; white-space:nowrap}
  .tab:hover{color:var(--ink); background:var(--code-bg)}
  .tab.active{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
  /* a tab is as wide as its bold label, open or not, so a tap moves nothing */
  .tab .lbl{display:inline-flex; flex-direction:column; align-items:center}
  .tab .lbl::after{content:attr(data-t); font-weight:600; height:0; visibility:hidden; overflow:hidden; pointer-events:none}
  .tab.add{color:var(--muted); border-bottom-color:transparent; font-size:15px; min-width:36px; justify-content:center}
  .tab.filt .lbl{color:var(--accent)}
  .tab.cm{margin-right:5px; border-right:1px solid var(--line)}
  .tab.cm .lbl{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  /* the open tab's actions, at the row's end */
  .passacts{display:inline-flex; align-items:center; gap:2px; margin-left:auto; align-self:center; padding-left:8px; flex:none}
  .tbtn{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; padding:0;
    border:0; border-radius:7px; background:transparent; box-shadow:none; color:var(--muted); font-size:16px; line-height:1}
  .tbtn:hover{color:var(--ink); background:var(--well)}
  .tbtn.x:hover{color:var(--hot)}
  .tbtn svg{width:14px; height:14px}

  .tbtn.m.off{color:var(--ink)}

  .rotact:hover{color:var(--ink)}

  .chan .x{opacity:.55; cursor:pointer}
  .chan .x:hover{opacity:1; color:var(--hot)}
  .addmini{cursor:pointer; color:var(--muted); border:1px dashed var(--line); border-radius:7px; padding:3px 8px; font-size:12px}
  .addmini:hover{color:var(--ink); border-color:var(--muted)}
  .addmini[aria-disabled="true"]{cursor:default; color:var(--muted); border-color:var(--line)}
  .inputs{display:flex; gap:6px; align-items:center; margin:12px 0; flex:0 0 auto; font-size:12px; color:var(--muted)}

  .istrip{flex:0 1 auto; gap:6px}
  .chip{border:1px solid var(--line); border-radius:7px; padding:3px 8px; color:var(--muted); cursor:help; font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .chip.arr{color:var(--ink); border-color:var(--accent)}
  .shadercard>[hidden]{display:none}
  .ctl{min-width:0; background-color:var(--well); border:1px solid var(--line); border-radius:6px; color:var(--ink);
    box-shadow:none; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; padding:5px 8px; outline:none}
  .ctl:focus{border-color:var(--muted)}
  select.ctl{padding-right:28px}
  /* a number field fits its value, with no spin buttons in any engine */
  input.ctl.num{width:calc(var(--n, 3) * 1ch + 18px)}
  input[type=number]{-moz-appearance:textfield; appearance:textfield}
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; appearance:none; margin:0}
  .layers{flex:0 0 auto}
  .lyrow{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--muted)}
  .lay{border:1px solid var(--line); border-radius:10px; padding:2px 10px; container-type:inline-size}
  .lay + .lay{margin-top:10px}
  /* a layer's header is one row: a strip that scrolls sideways when it does not
     fit, and the actions pinned at the right end, where nothing moves them */
  .lhead{display:flex; align-items:center; gap:6px; min-height:36px}
  /* a row that does not fit scrolls sideways, a swipe on touch and a drag
     with the mouse, and fades out at a side where it goes on */
  .strip{min-width:0; display:flex; align-items:center; overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; overscroll-behavior-x:contain}
  .strip::-webkit-scrollbar{display:none}
  .strip>*{flex:none}
  .strip.drag{cursor:grabbing; user-select:none}
  .strip.mr{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
  .strip.ml{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px); mask-image:linear-gradient(to right,transparent,#000 36px)}
  .strip.ml.mr{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent); mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
  .lstrip{flex:1 1 auto; gap:12px}
  .lstrip .lsp{flex:1 0 0}
  .lhead .tog{display:flex; align-items:baseline; gap:8px; padding:6px 0; background:none; border:0; box-shadow:none; text-align:left; transition:none}
  .lhead .tog:active{transform:none}
  .lhead .tog .car{width:12px; flex:none; color:var(--muted); font-size:11px}
  .lsels{display:inline-flex; align-items:center; gap:12px}
  .lsels .hk{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
  .lmv{display:inline-flex; align-items:center; gap:2px}
  .lhead>.lacts{padding-left:4px; border-left:1px solid var(--line)}
  /* the collapsed words give way before the strip scrolls */
  .lstrip>input.ctl.hword{flex:0 1 220px; min-width:110px}
  .lname{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink); white-space:nowrap}
  .lkind{font-size:12px; color:var(--muted); flex:none}
  .lacts{display:inline-flex; align-items:center; gap:2px; flex:none}
  .lbody{display:flex; flex-direction:column; gap:10px; padding:2px 0 8px 20px}
  /* one setting per line: its key, then its control */
  .kvs{display:flex; flex-direction:column; align-items:stretch; gap:8px}
  .kv{display:flex; align-items:flex-start; gap:8px; min-width:0}
  /* the key column fits the longest key, border_radius, at the phone's size */
  .kvs>.kv>.k{width:92px; flex:none; margin-top:4px}
  .kvs>.kv>.v{flex:1}
  .kv>.v>.grow{flex:1}
  .kv>.k, .fxname{font-size:13px; color:var(--accent)}
  .kv>.v{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; min-width:0}
  .sub{display:inline-flex; align-items:center; gap:6px}
  .sub>.k{font-size:12px; color:var(--muted)}
  .kv>.v>.k2{font-size:13px; color:var(--accent); margin-left:10px}
  .grad{display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px 10px}
  .clr{display:inline-flex; align-items:center; gap:8px}
  .clr input[type=color]{width:44px; flex:none}
  .clr .tbtn{margin-left:-4px}
  .clrnone{width:44px; height:22px; padding:0; border:1px dashed var(--scroll); border-radius:8px; background:transparent; box-shadow:none;
    color:var(--muted); font:11px ui-monospace,Menlo,monospace; transition:none}
  .clrnone:hover{border-color:var(--muted); color:var(--ink)}
  .clrnone:active{transform:none}
  .disc{align-self:flex-start; padding:4px 2px; background:none; border:0; box-shadow:none; color:var(--muted); font-size:13px; transition:none}
  .disc:hover{color:var(--ink)}
  .disc:active{transform:none}
  /* the shader line: a changed shader's undo icon sits in a slot after the
     toggle, kept while hidden. It shows on hover under a mouse, and always on
     a phone */
  .shline{display:flex; align-items:center; gap:2px; margin-top:14px}
  .shline>.disc{align-self:center}
  #shUndo{visibility:hidden; color:var(--mod); padding:4px 2px}
  #shUndo.on{visibility:visible}
  #shUndo svg{display:block; width:.6em; height:.6em}
  @media (hover:hover){
    #shUndo.on{visibility:hidden}
    .shline:hover #shUndo.on, #shUndo.on:focus-visible{visibility:visible}
  }
  /* a pass's size: a dropdown, then its fields */
  .sizerow .sub>.k{font-size:12px}
  .sizerow select.ctl:disabled{opacity:.4; cursor:default}
  /* a value that differs from its default: its key in the mark colour */
  .mk{color:var(--mod)!important}
  /* a changed value's key takes it back to default: the tap area reaches past
     the words, and under a mouse the key takes a dotted underline and an undo
     icon shows after it, 0.6em square. Under a mouse every key that can take
     its value back keeps the icon's slot, so nothing moves when a mark comes
     or goes, and the key column widens by the slot. The slot is an empty
     inline box in the key's font, so the icon's middle is the middle of the
     words' line. --ug, the gap between the words and the icon, equals the gap
     to the control after the key. */
  .rk{position:relative; cursor:pointer}
  .rk::before{content:""; position:absolute; inset:-8px -6px}
  .undo{display:none}
  .undo svg{position:absolute; right:0; top:50%; width:.6em; height:.6em; margin-top:-.3em; color:var(--mod); visibility:hidden}
  .mark{white-space:nowrap}
  .kv>.v>.k2{--ug:8px}
  .lyrow>.mark{--ug:7px}
  @media (hover:hover){
    .undo{display:inline; position:relative; padding-left:calc(.6em + var(--ug, 6px)); font-style:normal}
    .kvs>.kv>.k{width:calc(92px + .6em + var(--ug, 6px))}
    .rk:hover{text-decoration:underline dotted; text-underline-offset:3px}
    .rk:hover>.undo svg{visibility:visible}
  }
  @media (pointer:coarse){ .rk::before{inset:-12px -8px} }
  .fx{display:flex; flex-direction:column; gap:4px; align-items:flex-start; border-top:1px solid var(--line); padding-top:10px}
  .fx>.addwrap{margin-bottom:4px}
  /* an effect: its name, its fields, and its eye and remove button at the row's end.
     The fields wrap beside the name, and on a phone the row scrolls instead */
  .fxrow{align-self:stretch; display:flex; align-items:flex-start; gap:6px}
  .fstrip{flex:1 1 auto; align-items:baseline; gap:14px}
  .fstrip>.fxname{width:104px}
  .fstrip>.fxf{flex:1 1 0; min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px}
  .fxf>*{flex:none}
  .fxf>.sub, .fxacts{min-height:32px}
  .fxacts{display:inline-flex; align-items:center; gap:2px}
  /* a rect's border: its fields, then its eye and remove button at the row's end */
  .kv>.fxacts{flex:none}
  .kv.off>.k, .kv.off>.v{opacity:.4}
  /* a line's points, one x y pair per line */
  .pts{display:flex; flex-direction:column; align-items:flex-start; gap:6px}
  .pt{display:inline-flex; align-items:center; gap:6px 14px}
  @container (max-width:520px){
    .grad{column-gap:8px}
    .lstrip>input.ctl.hword{flex-basis:150px; min-width:150px}
    .fstrip>.fxname{width:auto}
  }
  /* the words box grows with them: its hidden copy sizes it */
  .grow{position:relative; min-width:0}
  .grow>pre, .grow>textarea{margin:0; font:13px/1.4 ui-sans-serif,system-ui,sans-serif; padding:6px 8px; border:1px solid transparent; border-radius:6px;
    white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word}
  .grow>pre{visibility:hidden; min-height:3.2em}
  .grow>textarea{position:absolute; inset:0; width:100%; height:100%; resize:none; overflow:hidden; background:var(--well); border-color:var(--line); color:var(--ink); outline:none}
  /* a layer's words box grows to eight lines, then scrolls inside */
  .kv .grow>pre{max-height:calc(8 * 1.4em + 14px); overflow:hidden}
  .kv .grow>textarea{overflow-y:auto}
  .grow>textarea:focus{border-color:var(--muted)}
  .ferr{font:12px/1.4 ui-monospace,Menlo,monospace; color:var(--hot)}
  .ferr[hidden]{display:none}
  /* touch: tabs, their buttons and the fields take a fingertip */
  @media (pointer:coarse){
    .tab{min-height:44px; padding:0 14px; font-size:14px}
    .tab.add{min-width:48px; font-size:18px}
    .tbtn{width:40px; height:40px; font-size:20px; border-radius:10px}
    .tbtn svg{width:18px; height:18px}
    .passacts{gap:4px}
    .ctl{font-size:14px; padding:9px 10px; min-height:40px}
    select.ctl{padding-right:30px}
    input.ctl.num{width:calc(var(--n, 3) * 1ch + 22px); min-width:44px}
    .clr input[type=color], .clrnone{width:44px; height:38px; border-radius:10px}
    .clr input[type=color]::-webkit-color-swatch{border-radius:8px}
    .clr input[type=color]::-moz-color-swatch{border-radius:8px}
    .addmini{padding:9px 13px; font-size:13px}
    .chan{padding-right:0}
    .chan .x{padding:8px 11px; font-size:16px}
    .addmenu .it{padding:12px 16px; font-size:15px}
    .lhead{min-height:48px}
    .lname{font-size:14px}
    .lbody{padding-left:4px}
    .disc{min-height:40px; font-size:14px}
    .fxf>.sub, .fxacts{min-height:44px}
    .fxname, .kv>.k, .kv>.v>.k2{font-size:14px}
    .grow>pre, .grow>textarea{font-size:15px; padding:9px 10px}
    .kv .grow>pre{max-height:calc(8 * 1.4em + 20px)}
    .kvs>.kv>.k{margin-top:10px}
  }
  /* the question before a removal, over a scrim that cancels it */
  .ask{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:18px; background:var(--scrim)}
  .ask[hidden]{display:none}
  .ask .card{width:100%; max-width:340px}
  .ask .q{margin:0 0 14px; font-size:14px; overflow-wrap:anywhere}
  .ask .acts{display:flex; gap:8px; justify-content:flex-end}
  .ask .renin{display:block; width:100%; margin:0 0 8px}
  .ask .ferr{margin:0 0 10px}
  @media (pointer:coarse){
    .ask .q{font-size:15px}
    .ask .acts button{min-height:44px; padding:0 18px; font-size:15px}
  }
  @media (max-width:640px){
    html,body{height:auto}
    body{height:auto; overflow:auto; display:block; padding:12px}
    header{flex-wrap:wrap; white-space:normal}
    /* a notice takes its own line, and the buttons stay together under it */
    .actions .notice{flex:1 1 100%}
    .grid{display:block}
    /* dissolve the column so the sticky stage sticks against the whole page */
    .leftcol{display:contents}
    .colgrip{display:none}
    .fstrip>.fxf{display:contents}
    .leftcol>.panel + .panel{margin-top:18px}
    .shadercard{display:block; margin-top:18px; overflow:visible}
    .shadercard .editor{flex:none}
    /* a pass with less in it never shortens the page under a tab that was just tapped */
    .shadercard{min-height:100vh}
    .passhead{position:static}
  }
</style>
</head>
<body>
<header>
  <span class="brand">ghee<span class="dot"> · console</span></span>
  <div class="nav">
    <button class="ghost step" id="prev" title="previous scene">‹</button>
    <select id="scenes"></select>
    <button class="ghost step" id="next" title="next scene">›</button>
  </div>
  <span class="spacer"></span>
  <div class="actions">
    <span class="notice bad" id="offline" hidden>server not responding</span>
    <button class="notice" id="moved" hidden title="dismiss"></button>
    <button class="notice" id="stale" hidden title="a reload takes the new files and keeps the edits made here">files changed · reload</button>
    <button class="notice" id="behind" hidden title="read the scene as it is now">this scene changed since you loaded it · reload</button>
    <button class="primary" id="apply">apply</button>
    <button id="save" disabled>save</button>
    <button id="reset" type="button" disabled>back to defaults</button>
    <button class="ghost" id="theme" title="toggle theme">☾</button>
  </div>
</header>

<div class="grid">
  <div class="leftcol">
    <div class="panel stage">
      <div class="screen">
        <div class="infowrap">
          <button class="ovbtn" id="infoBtn" title="render info" aria-label="render info">ⓘ</button>
          <div class="infopop" id="infoPop"></div>
        </div>
        <div class="ovtools">
          <button class="ovbtn" id="muteBtn" title="stop the stream" aria-label="stop the stream" aria-pressed="false"></button>
          <button class="ovbtn" id="rotBtn" title="rotate preview 90°" aria-label="rotate preview 90°">↻</button>
          <button class="ovbtn" id="pipBtn" title="pop the preview into its own window" aria-label="pop out preview" hidden>⧉</button>
          <button class="ovbtn" id="fsBtn" title="fullscreen preview" aria-label="fullscreen preview" hidden>⛶</button>
        </div>
        <button class="minitrig" id="miniBtn" title="controls" aria-label="controls" aria-haspopup="menu" aria-expanded="false"><span>⋮</span></button>
        <div class="ovmenu" id="ovMenu" role="menu">
          <button data-for="infoBtn"><span class="ic">ⓘ</span><span>render info</span></button>
          <button data-for="muteBtn"><span class="ic"></span><span>stop the stream</span></button>
          <button data-for="rotBtn"><span class="ic">↻</span><span>rotate preview 90°</span></button>
          <button data-for="pipBtn"><span class="ic">⧉</span><span>pop out preview</span></button>
          <button data-for="fsBtn"><span class="ic">⛶</span><span>fullscreen preview</span></button>
        </div>
        <div class="frame"><img id="stream" alt="render"><canvas id="streamcv" style="display:none"></canvas></div>
        <div class="popped" id="popped" hidden>preview popped out</div>
      </div>
    </div>

    <div class="panel card">
      <h3>parameters</h3>

      <div class="toolbar">
        <button id="addToggle" class="ghost">+ parameter</button>
      </div>
      <div class="addparam" id="addRow">
        <input class="name" id="pName" placeholder="name">
        <select id="pPlace"><option value="pass">this pass</option><option value="scene">scene</option></select>
        <select id="pType"><option value="float">float</option><option value="int">int</option><option value="bool">bool</option><option value="color">color</option><option value="vec2">vec2</option><option value="vec3">vec3</option><option value="string">string</option></select>
        <input id="pVal" placeholder="value" value="0.5">
        <input id="pMin" placeholder="min" value="0">
        <input id="pMax" placeholder="max" value="1">
        <button id="pAdd">add</button>
      </div>
    </div>
  </div>

  <div class="colgrip" id="colgrip" title="drag to resize"></div>

  <div class="panel card shadercard">
    <div class="passhead">
      <h3>passes</h3>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="inputs" id="inputs"></div>

    <div class="lyrow sizerow" id="size"></div>
    <div class="layers" id="layers"></div>
    <div class="shline" id="shLine">
      <button class="disc shtog" id="shTog" type="button" aria-expanded="false"><span id="shCar">▸</span> shader</button>
      <button class="disc" id="shUndo" type="button" aria-label="back to default"></button>
    </div>
    <div class="editor" id="codeEd" hidden><pre aria-hidden="true"></pre><textarea id="code" spellcheck="false" aria-label="shader"></textarea><div class="errmark"></div></div>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askText" hidden>
  <div class="panel card">

</div>

<div class="ask" id="ren" role="dialog" aria-modal="true" aria-labelledby="renText" hidden>

    <div class="ferr" id="renErr" hidden></div>

      <button id="renNo">cancel</button>
      <button class="primary" id="renYes">ok</button>
    </div>
  </div>
</div>

<script src="h264client.js"></script>
<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const enc = encodeURIComponent;
// the scene as ghee's working copy holds it, with this page's edits
let work = null;
let active = null;
// the tab in the editor: a pass index, or COMMON for the scene's common block
// (which is also what /stats reports as error_pass for an error inside it)
const COMMON = "common";
let curPass = 0;
const onCommon = () => curPass === COMMON;
const hasCommon = () => !!work && typeof work.common === "string";
const commonCode = () => (hasCommon() ? work.common : "");
function setCommon(code){ work.common = code; }
// the names of the scenes that a program writes, from /scenes
let procedural = [];
const isProcedural = () => procedural.includes(active);
let lastDisplay = null, lastStats = null, compileTimer = null;
let devModel = "", devGpu = "";
const FRAME = $(".frame"), SCREEN = FRAME.parentElement, IMG = $("#stream"), CV = $("#streamcv");

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const TOK = [
  ["cm", /\/\/[^\n]*|\/\*[\s\S]*?\*\//],
  ["pp", /#[^\n]*/],
  ["ty", /\b(?:void|float|int|bool|vec[234]|mat[234]|sampler2D)\b/],
  ["kw", /\b(?:if|else|for|while|return|const|uniform|varying|attribute|struct|precision|highp|mediump|lowp|in|out|inout|break|continue|discard)\b/],
  ["bi", /\b(?:gl_FragColor|gl_FragCoord|gl_Position|texture2D|texture|sin|cos|tan|asin|acos|atan|abs|floor|ceil|fract|mix|clamp|min|max|pow|exp|log|length|distance|dot|cross|normalize|reflect|smoothstep|step|mod|sqrt|sign|radians|degrees)\b/],
  ["nu", /\b\d+\.?\d*\b/],
];
const RE = new RegExp(TOK.map(t => "(" + t[1].source + ")").join("|"), "g");
function highlight(src){
  let out = "", last = 0, m; RE.lastIndex = 0;
  while ((m = RE.exec(src))){
    out += esc(src.slice(last, m.index));
    for (let i=0;i<TOK.length;i++){ if (m[i+1]!=null){ out += `<span class="t-${TOK[i][0]}">${esc(m[0])}</span>`; break; } }
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last)) + "\n";
}
// A GLSL editor: a transparent textarea over its highlighted copy, and a bar
// that marks the error line. A long line wraps over several rows, so the bar
// takes its place and its height from a hidden copy of the lines, laid out
// at the editor's width.
function editor(box){
  const ta = box.querySelector("textarea"), hl = box.querySelector("pre"), bar = box.querySelector(".errmark");
  const rows = el("pre");
  rows.setAttribute("aria-hidden", "true");
  rows.style.cssText = "position:absolute; left:0; right:0; top:0; padding-top:0; padding-bottom:0; visibility:hidden";
  box.appendChild(rows);
  // the height of `text` in the editor, a last empty line included
  const tall = text => { rows.textContent = text + "\u200b"; return rows.offsetHeight; };
  const ed = {
    box, ta, line: 0,
    sync(){ hl.innerHTML = highlight(ta.value); ed.scroll(); },
    scroll(){ hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; ed.mark(ed.line); },
    mark(line){
      ed.line = line;
      if (!line || line < 1){ bar.style.display = "none"; return; }
      const lines = ta.value.split("\n"), pad = parseFloat(getComputedStyle(ta).paddingTop);
      const above = line > 1 ? tall(lines.slice(0, line - 1).join("\n")) : 0;
      bar.style.height = tall(lines[line - 1] || "") + "px";
      bar.style.top = (pad + above - ta.scrollTop) + "px";
      bar.style.display = "block";
    },
  };
  ta.addEventListener("scroll", ed.scroll);
  return ed;
}
const CODE = editor($("#codeEd"));

const statNum = (v, d, unit) => (typeof v === "number" ? v.toFixed(d) + (unit || "") : "-");
function refreshInfo(){
  const pop = $("#infoPop"); if (!pop) return;
  const s = lastStats;
  let params=0, arrays=0, feedback=false;
  ((work&&work.passes)||[]).forEach(p => { params += Object.keys(p.params||{}).length; arrays += (p.arrays||[]).length; (p.channels||[]).forEach(c => { if (c.buffer === p.name) feedback = true; }); });
  const np = (work&&work.passes&&work.passes.length) || 0;
  const hidden = ((work&&work.passes)||[]).filter(p=>p.visible===false).length;
  pop.innerHTML = "";
  const sect = t => { const d = el("div","ipsect"); d.appendChild(el("div","iphead",t)); pop.appendChild(d); return d; };
  const row = (into,k,v,cls) => {
    const r = el("div", "iprow" + (cls ? " " + cls : ""));
    r.appendChild(el("span","k",k));
    const val = el("span","v",v);
    r.appendChild(val); into.appendChild(r);
    return val;
  };
  const live = sect("live");
  row(live, "fps", s ? statNum(s.fps, 1) : "-");
  row(live, "frame", s ? statNum(s.frame_ms, 2, " ms") : "-");
  row(live, "stream", s ? statNum(s.stream_fps, 1, " fps") : "-");
  const out = sect("output");
  const dests = (s && s.out) || [];
  row(out, "out", dests.length ? dests.join(" + ") : "-");

function effectiveRotation(){
  const o = localStorage.getItem("ghee:rotation");

  return (lastDisplay && lastDisplay.rotation) ? lastDisplay.rotation : 0;
}
function inlineBox(){
  const stage = SCREEN.parentElement, sc = getComputedStyle(stage), bc = getComputedStyle(SCREEN);
  const pad = n => parseFloat(sc["padding" + n]) + parseFloat(bc["padding" + n]);
  return {
    w: Math.max(64, stage.clientWidth - pad("Left") - pad("Right")),
    // the stage is sticky over a scrolling column, so it takes half the viewport
    h: Math.max(64, innerHeight * 0.5),
    fill: false,
  };
}
function previewBox(){
  if (pipWin) return {w: pipWin.innerWidth, h: pipWin.innerHeight, fill: true};
  const fs = document.fullscreenElement;

  return inlineBox();
}

}

  if (!lastDisplay) return;

  const dw = land ? h : w, dh = land ? w : h;            // on-screen dimensions
  const scale = fitPreview(dw, dh, previewBox());
  const fw = Math.round(dw * scale), fh = Math.round(dh * scale);
  FRAME.style.width = fw + "px";
  FRAME.style.height = fh + "px";
  SCREEN.classList.toggle("tiny", fw < 220 || fh < 72);
  for (const el of [IMG, CV]) {                          // whichever preview is active
    el.style.width = (land ? fh : fw) + "px";            // pre-rotation size so it covers the frame
    el.style.height = (land ? fw : fh) + "px";
    el.style.transform = `translate(-50%,-50%) rotate(${R}deg)`;
  }
  const src = previewSource();
  const dpr = (pipWin || window).devicePixelRatio || 1;
  FRAME.classList.toggle("crisp", crispPreview(src.w, w, land ? fh : fw, dpr));
  holdStagePlace(!!pipWin);
}
function previewSource(){
  if (CV.style.display !== "none") return {kind: "h264", w: CV.width, h: CV.height};
  if (!IMG.src) return {kind: "-", w: 0, h: 0};        // startPreview has not run yet
  return {kind: "mjpeg", w: IMG.naturalWidth, h: IMG.naturalHeight};
}

// everything that changes the renderer is POST: a GET is reachable from a
// hostile page's <img src>
async function jget(u){ return (await fetch(u)).json(); }

function clone(o){ return JSON.parse(JSON.stringify(o)); }
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
const has = (o, k) => isObj(o) && Object.prototype.hasOwnProperty.call(o, k);

// ---- the working copy's edits, as GET /edits lists them, and the defaults ----
// A host that keeps no defaults answers no edits, and this page then marks
// nothing and saves nothing.
const NO_EDITS = {rev: null, values: {}, items: [], unsaved: false, aside: []};
let E = NO_EDITS, D = null;
// rev is the revision of the scene this page last read, which every edit
// carries. known is the last revision this page accounts for, its own edits
// included: /stats moving past it means another client changed the scene.
let rev = null, known = null;
const layerEdit = n => ((E.values || {}).layers || {})[n];
const passEdit = n => ((E.values || {}).passes || {})[n];
const defPass = n => (D && (D.passes || []).find(p => p.name === n)) || null;
function defLayer(n){
  for (const p of (D && D.passes) || []) for (const d of p.layers || []) if (d.name === n) return d;
  return null;
}
const hasEdits = () => Object.keys(E.values || {}).length > 0 || (E.items || []).length > 0;
// save lights while the working copy holds edits that the state file lacks,
// and back to defaults while it holds any edit
function paintStatus(){

  $("#reset").disabled = !hasEdits();
}

// An edit of scene `scene`. It carries the revision this page last read and
// the page's vid, so ghee refuses one that another client made stale. Its
// answer, or null when the request failed, comes back, and every edit brings
// the marks up to date.
let inflight = 0;
async function edit(path, scene, q, body){
  let u = `${path}?${q}&vid=${VID}`;
  if (rev != null && scene === active) u += `&rev=${rev}`;
  const o = body == null ? {method: "POST"} : {method: "POST", headers: {"Content-Type": "application/json"}, body};
  inflight++;
  try {
    const r = await fetch(u, o);
    if (r.status === 409) sceneMoved(scene);
    else if (r.status === 412) $("#behind").hidden = false;
    return r;
  } catch (_) {
    return null;
  } finally {
    inflight--;

  }
}
let editsTimer = null, editsReading = 0;
function editsSoon(){ clearTimeout(editsTimer); editsTimer = setTimeout(readEdits, 150); }
async function readEdits(){
  editsTimer = null;
  const name = active;
  editsReading++;
  try {
    const r = await fetch("/edits?name=" + enc(name));
    if (!r.ok || name !== active) return;
    E = await r.json();
    if (E.rev != null) known = E.rev;
    paintMarks(); paintStatus();
  } catch (_) {
  } finally { editsReading--; }
}
// no edit of this page's on its way, nor the read of its edits
const settled = () => !inflight && !editsTimer && !editsReading && !compileTimer;

// ---- marks: a value that differs from its default shows its key in the
// mark colour. Only a value is marked, never a name. A key registers how to
// tell that its value differs, from GET /edits, and how to take it back to
// the default, the one thing to do with a changed value, so a click on the
// key does it at once. A locked key shows its mark and takes no click ----
const MARKS = new WeakMap();
const UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
$("#shUndo").innerHTML = UNDO;
// a key holds its undo icon's slot from the start
function markKey(key, test, reset){
  MARKS.set(key, {test, reset});
  key.classList.add("mark");
  const i = el("i", "undo"); i.innerHTML = UNDO; key.appendChild(i);
  return key;
}
function paintMarks(){
  document.querySelectorAll(".mark").forEach(k => {
    const m = MARKS.get(k);
    if (!m) return;
    const on = !!m.test(), back = on && !k.closest(".locked");
    k.classList.toggle("mk", on);
    k.classList.toggle("rk", back);
  });
  const sh = shaderEdited();
  $("#shTog").classList.toggle("mk", sh);
  $("#shUndo").classList.toggle("on", sh);
}
document.addEventListener("click", e => {
  const k = e.target.closest && e.target.closest(".rk"), m = k && MARKS.get(k);
  if (!m) return;
  e.preventDefault(); e.stopPropagation();
  m.reset();
});
// layer d's own setting `k`, back to the default layer's
function markField(key, p, d, k){
  return markKey(key, () => has(layerEdit(d.name), k), () => {
    const e = defLayer(d.name);
    if (!e) return;
    const v = e[k] === undefined ? null : clone(e[k]);
    if (k === "shape") switchShape(p, d, v); else setKey(p, d, k, v);
    recard(p, d.name);
  });
}
// field `k` of layer d's effect or border `f`, which the default layer has
// too. `back` sets the field, null for its default.
function markSub(key, d, f, k, back){
  return markKey(key, () => {
    const e = defLayer(d.name), lv = layerEdit(d.name);
    return !!e && isObj(e[f]) && isObj(lv && lv[f]) && has(lv[f], k);
  }, () => {
    const e = defLayer(d.name);

// A stale scene is one the server compiled before its files changed: what is
// rendering is older than what a reload would give. A dead server is the other
// thing a silent poll used to hide, so it gets its own line.
const OFFLINE_AFTER = 3;   // consecutive /stats failures
let pollFails = 0, staleScene = false;
const offline = () => pollFails >= OFFLINE_AFTER;
function showNotices(){
  $("#offline").hidden = !offline();
  $("#stale").hidden = !staleScene || offline();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Switching to the active name is the reload: ghee reads the scene's files
// again and lays the working copy's edits over them. A reload that carries
// the page's revision answers 409 once the console is on another scene.
async function reloadScene(){
  const name = active;
  const r = await edit("/switch", name, "name=" + enc(name));
  if (!r || !r.ok) return;
  let s = null;
  for (let i = 0; i < 20; i++){          // the switch is queued for the render thread
    s = await jget("/stats").catch(()=>null);
    if (s && !s.stale) break;
    await sleep(50);
  }
  staleScene = !!(s && s.stale);         // still stale: the new files did not compile
  showNotices();
  if (name === active) await refresh(true);
}

let FILTERS = {};   // name -> filter def (fragment + params), from /filters

// H264/WebCodecs preview when the browser can (needs a secure context:
// https or localhost); MJPEG otherwise, and on any stream/decoder failure.
//
// the vid groups this page's streams on the server, and the ping keeps them alive
const VID = "v" + Math.random().toString(36).slice(2) + Date.now().toString(36);
const PING_MS = 3000;
const STREAM_KEY = "ghee:ui:stream";
const PLAY = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
let previewWhy = "";
let mjpegOnly = false;    // a decoder that failed once fails the same way again
let h264 = null;          // attachH264 handle while the h264 stream is up
let streaming = false, pingTimer = null;
let streamMuted = localStorage.getItem(STREAM_KEY) === "muted";

function ping(){ fetch("/ping?vid=" + VID, {method:"POST"}).catch(()=>{}); }
function startStream(){
  if (streamMuted || streaming) return;
  streaming = true;
  ping();
  pingTimer = setInterval(ping, PING_MS);
  startPreview();
}
function stopStream(){
  streaming = false;
  clearInterval(pingTimer); pingTimer = null;
  if (h264){ h264.stop(); h264 = null; }
  IMG.removeAttribute("src");   // ends the MJPEG request
  refreshInfo();
}
function fallbackToMjpeg(why){
  previewWhy = why;
  mjpegOnly = true;
  h264 = null;
  CV.style.display = "none";
  IMG.style.display = "";
  if (streaming) IMG.src = "/stream?vid=" + VID;
  IMG.onload = () => { refreshInfo(); applyRotation(); };
  refreshInfo();
}
function startPreview(){
  if (!mjpegOnly && typeof attachH264 === "function" && "VideoDecoder" in window && window.isSecureContext) {
    IMG.style.display = "none";
    CV.style.display = "";
    refreshInfo();
    h264 = attachH264(CV, "/h264?vid=" + VID, {onfail: e => fallbackToMjpeg("h264 preview dropped: " + e)});
  } else {
    fallbackToMjpeg(previewWhy || (window.isSecureContext
      ? "this browser has no WebCodecs VideoDecoder"
      : "h264 preview needs https or localhost"));
  }
}
function applyMuted(){
  SCREEN.classList.toggle("muted", streamMuted);
  const b = $("#muteBtn");
  b.innerHTML = streamMuted ? PLAY : PAUSE;
  b.title = streamMuted ? "start the stream" : "stop the stream";

// The scene, its defaults and its edits, as ghee holds them now. A host that
// keeps no defaults answers 404 for them.
async function readScene(name){
  const q = "name=" + enc(name);
  const [sr, dr, er] = await Promise.all([fetch("/scene?" + q), fetch("/scene?" + q + "&defaults=1"), fetch("/edits?" + q)]);
  if (!sr.ok) throw new Error(await sr.text());
  const tag = sr.headers.get("ETag");
  return {
    scene: await sr.json(),
    rev: tag ? parseInt(tag.replace(/"/g, ""), 10) : null,
    defaults: dr.ok ? await dr.json() : null,
    edits: er.ok ? await er.json() : NO_EDITS,
  };
}
function take(got){
  work = got.scene; D = got.defaults; E = got.edits;
  rev = known = got.rev;
}

// `own`, a load that this page asked for, hides the moved notice, which a
// load after a refused edit shows.
async function loadScene(name, own = true){
  if (own) $("#moved").hidden = true;
  $("#behind").hidden = true;
  // a rebuild still to post holds the copy of the scene before
  clearTimeout(compileTimer); compileTimer = null;
  active = name;
  const got = await readScene(name);
  if (name !== active) return;
  take(got);
  $("#scenes").value = name;
  curPass = 0; postErr = ""; errOpen = null; layerUI.clear(); layerChanges = null;
  paintAll();
  askAside();
}
// Every part of the page drawn from the working copy.
function paintAll(){
  if (!work.passes || !work.passes.length) {   // a scene with no passes: stream only
    $("#tabs").innerHTML = ""; $("#inputs").innerHTML = ""; $("#chans").innerHTML = ""; $("#size").innerHTML = ""; $("#layers").innerHTML = "";
    $("#params").innerHTML = '<div class="muted">no parameters</div>';
    $("#shLine").hidden = true; CODE.box.hidden = true;
    CODE.ta.value = ""; CODE.sync(); showErrors(); refreshInfo(); paintStatus();
    return;
  }
  buildPass(); buildParams(); refreshInfo(); paintStatus();
}

// The scene read again as ghee holds it, with the open pass, the open layers
// and the shader's line left as they are. A follow leaves alone what is in
// use: it waits while the shader, a param's field, a menu or a dialog holds
// the page, and keeps this page's copy of a layer whose card holds the focus.
// `force` reads it all, after this page's own reset, answer or reload.
let reading = false;
const inUse = () => {
  const a = document.activeElement;
  return !!(menuFrom || answer || named || a === CODE.ta || (a && a.closest && a.closest("#params, #size")));
};
async function refresh(force = false){
  if (reading || !work || (!force && inUse())) return;
  reading = true;
  const name = active;
  try {
    const got = await readScene(name);
    if (name !== active) return;
    const open = onCommon() ? COMMON : ((work.passes || [])[curPass] || {}).name;
    const busy = force ? [] : busyLayers();
    let kept = false;
    (got.scene.passes || []).forEach(fp => {
      const wp = (work.passes || []).find(p => p.name === fp.name);
      if (!wp || !fp.layers || !busy.length) return;
      fp.layers = fp.layers.map(f => {
        const mine = busy.includes(f.name) && (wp.layers || []).find(d => d.name === f.name);
        if (mine) kept = true;
        return mine || f;
      });
    });
    take(got);
    // a read that this page asked for is the scene as it is now
    if (force){ postErr = ""; $("#behind").hidden = true; }
    // a kept layer reads again at the next poll
    if (kept) known = -1;
    if (open === COMMON) curPass = hasCommon() ? COMMON : 0;
    else curPass = Math.max(0, (work.passes || []).findIndex(p => p.name === open));
    if (!work.passes || !work.passes.length){ paintAll(); return; }
    buildTabs(); buildInputs(); buildChannels(); buildSize();
    const p = onCommon() ? null : work.passes[curPass], cards = [...document.querySelectorAll("#layers .lay")];
    const shown = cards.map(c => c.dataset.name).reverse().join("\n");
    if (kept && p && !p.filter && shown === (p.layers || []).map(d => d.name).join("\n"))
      cards.forEach(c => { if (!busy.includes(c.dataset.name)) recard(p, c.dataset.name); });
    else relist();
    loadCode(); paintShader(); showErrors(); syncAddRow(); buildParams(); refreshInfo(); paintStatus(); paintMarks();
    askAside();
  } catch (_) {
  } finally { reading = false; }
}

// ---- an item set aside: its default changed since its edit, and the page
// asks once, item by item, whether to keep the edit or take the new default.
// Keep mine is first in focus, and Escape and the scrim do nothing, so every
// item gets its one answer ----
const ASIDE_TITLE = {
  fragment: a => `Default ${a.pass} shader updated`,
  common: () => "Default common shader updated",
  channels: a => `Default ${a.pass} channels updated`,
  layers: a => `Default ${a.pass} layers updated`,
  passes: () => "Default passes updated",
  param: a => `Default ${a.param} param updated`,
  filters: () => "Default filters updated",
};
let answering = false;
async function askAside(){
  const list = (E.aside || []).filter(a => ASIDE_TITLE[a.item]);
  if (answering || !list.length) return;
  answering = true;
  const name = active;
  try {
    for (const a of list){
      const keep = await ask(ASIDE_TITLE[a.item](a), {yes: "keep mine", no: "update to default", forced: true});
      if (name !== active) return;
      let q = `name=${enc(name)}&item=${enc(a.item)}&answer=${keep ? "keep" : "default"}`;
      if (a.pass != null) q += "&pass=" + enc(a.pass);
      if (a.param != null) q += "&param=" + enc(a.param);
      // 404: another page answered first
      const r = await edit("/aside", name, q);
      if (r && !r.ok && ![404, 409, 412].includes(r.status)){
        postErr = await r.text(); showErrors();
        return;
      }
    }
  } finally { answering = false; }
  if (name === active) await refresh(true);
}

// ---- the passes card: the tab row, a pass's inputs, its channels, its layers, its shader ----

function setPass(i){ curPass = i; buildPass(); }
function buildPass(){
  buildTabs(); buildInputs(); buildChannels(); buildSize(); buildLayers(); loadCode(); paintShader(); showErrors(); syncAddRow();

    Object.keys(p.params || {}).forEach(n => s.add(n));

function nameError(n, current){

function frameSize(){

// A change applies on release, since a size rebuilds.

  const key = markKey(el("span", null, "size"), () => { const v = passEdit(p.name); return has(v, "size") || has(v, "scale"); }, () => {
    const q = defPass(p.name);

const NEEDS_MTSDF = ["text_shadow", "glow", "text_stroke"];

const formKind = d => isImage(d) ? "image" : isShape(d) ? d.shape : "text";

const emptyOf = (d, key) => ((FORMAT.empty || {})[formKind(d)] || {})[key];

const layerUI = new Map();

  return u;

// A live field of layer d, or of its effect, set with no rebuild. The running

    .then(r => { if (r && !r.ok && r.status !== 409 && r.status !== 412 && scene === active) rebuildSoon(); });

    : key === "points" ? JSON.stringify(v) : v != null ? v : typeof empty === "number" ? empty : "none";

// ---- controls ----

function buildLayers(){

// A pass's layers paint in list order, and the card shows them front first:

async function delLayer(p, d){

// by +1 brings a layer forward, -1 sends it back. The moved layer's header

function moveLayer(p, d, by){

// A row that does not fit scrolls sideways: a swipe on touch, a drag with the
// mouse. A drag that moved is not a click on what it started on.
const stripFade = st => {
  const max = st.scrollWidth - st.clientWidth;
  st.classList.toggle("ml", st.scrollLeft > 1);
  st.classList.toggle("mr", st.scrollLeft < max - 1);
};
// a strip taken out of the page shrinks to nothing, and is let go then
const stripSeen = new ResizeObserver(es => es.forEach(e => {
  if (e.target.isConnected) stripFade(e.target); else stripSeen.unobserve(e.target);
}));
function strip(cls){
  const st = el("div", "strip " + cls);
  let x0 = null, s0 = 0, moved = false;
  st.addEventListener("scroll", () => stripFade(st));
  st.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0 || e.target.closest("input, select, textarea")) return;
    x0 = e.clientX; s0 = st.scrollLeft; moved = false;
  });
  st.addEventListener("pointermove", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0;
    if (!moved && Math.abs(dx) > 4){ moved = true; st.setPointerCapture(e.pointerId); st.classList.add("drag"); }
    if (moved) st.scrollLeft = s0 - dx;
  });
  const end = () => { x0 = null; st.classList.remove("drag"); };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
  st.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  stripSeen.observe(st);
  return st;
}
// A hidden layer keeps its content editable, and locks what only changes how

// Switching shape puts the old shape's own keys aside and brings the new

function layerCard(p, d){
  const u = ui(d.name), kind = kindOf(d), img = kind === "image", shape = kind === "shape";
  const hidden = d.visible === false, proc = isProcedural();
  const card = el("div", "lay" + (hidden ? " hid" : ""));
  card.dataset.name = d.name;
  const redo = () => {
    const was = card.querySelector(".lstrip").scrollLeft, next = layerCard(p, d);
    card.replaceWith(next);
    next.querySelector(".lstrip").scrollLeft = was;

  };
  const head = el("div", "lhead"), st = strip("lstrip"), tog = el("button", "tog");
  tog.type = "button"; tog.setAttribute("aria-expanded", String(u.open));

    const list = p.layers, k = list.indexOf(d), mv = el("span", "lmv");
    const up = tbtn("↑", `move layer ${d.name} up`, "", () => moveLayer(p, d, 1));
