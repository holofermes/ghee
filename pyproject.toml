[project]
# PyPI name; the import and CLI are `ghee` (that name is taken on PyPI).
name = "ghee-render"
version = "0.2.0"
description = "Multi-pass GLSL renderer for Raspberry Pi. Headless GLES2, out to SPI panels, HDMI, images or hardware H264."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "holofermes" }]
keywords = [
    "glsl",
    "shader",
    "shadertoy",
    "renderer",
    "headless",
    "raspberry-pi",
    "drm",
    "kms",
    "opengl-es",
    "spi-display",
    "oled",
    "st7789",
    "ssd1306",
    "vc4",
    "h264",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "Pillow>=9.4"]

[project.optional-dependencies]
# Hardware display drivers (ghee.drivers). Pi/panel only; off-device they will not import.
drivers = [
    "Adafruit-Blinka",
    "adafruit-circuitpython-rgb-display",
    "adafruit-circuitpython-ssd1306",
    "spidev",
]
# setuptools and build are what test_packaging.py rolls an sdist with.
test = ["pytest", "setuptools>=64", "build"]

[project.urls]
Repository = "https://github.com/holofermes/ghee"
Issues = "https://github.com/holofermes/ghee/issues"

[project.scripts]
ghee = "ghee.cli:main"
# alias matching the dist name, so `uvx ghee-render` works bare
ghee-render = "ghee.cli:main"

# setuptools (not hatchling) because the package builds a C extension: the engine
# (ghee/_engine) is compiled into ghee/lib/ by setup.py. Package data (the
# console web, example scenes, the built .so) is declared in setup.py.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
