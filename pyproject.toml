[project]
# PyPI name; the import and CLI are `ghee` (that name is taken on PyPI).
name = "ghee-render"
version = "0.1.0"
description = "Headless GLSL multipass renderer for Raspberry Pi and desktop Mesa, plus a shader-editor console."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "holofermes" }]
keywords = ["glsl", "shader", "raspberry-pi", "gles", "headless", "renderer"]
requires-python = ">=3.11"
# numpy is used by ghee.engine (the Renderer ctypes binding). The pure scene
# model (import ghee) does not need it, but the package ships the renderer too.
dependencies = ["numpy"]

[project.optional-dependencies]
# The console render server and image-sequence output encode JPEG frames.
console = ["Pillow"]
# Hardware display drivers (ghee.drivers). Pi/panel only; off-device they will not import.
drivers = [
    "Adafruit-Blinka",
    "adafruit-circuitpython-rgb-display",
    "adafruit-circuitpython-ssd1306",
    "spidev",
]
test = ["pytest", "Pillow"]

[project.urls]
Repository = "https://github.com/holofermes/ghee"
Issues = "https://github.com/holofermes/ghee/issues"

[project.scripts]
ghee = "ghee.cli:main"

# setuptools (not hatchling) because the package builds a C extension: the engine
# (ghee/_engine) is compiled into ghee/lib/ by setup.py. Package data (the
# console web, example scenes, the built .so) is declared in setup.py.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
