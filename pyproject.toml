[project]
name = "ghee"
version = "0.1.0"
description = "GLSL multipass scene model + renderer, plus a shader-editor console."
requires-python = ">=3.11"
# numpy is used by ghee.engine (the Renderer ctypes binding). The pure scene
# model (import ghee) does not need it, but the package ships the renderer too.
dependencies = ["numpy"]

[project.optional-dependencies]
# The console render server and image-sequence output encode JPEG frames.
console = ["Pillow"]
# Hardware display drivers (ghee.drivers). Pi/panel only; off-device they will not import.
drivers = [
    "Adafruit-Blinka",
    "adafruit-circuitpython-rgb-display",
    "adafruit-circuitpython-ssd1306",
    "spidev",
]
test = ["pytest", "Pillow"]

[project.scripts]
ghee = "ghee.cli:main"

# setuptools (not hatchling) because the package builds a C extension: the engine
# (ghee/_engine) is compiled into ghee/lib/ by setup.py. Package data (the
# console web, example scenes, the built .so) is declared in setup.py.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
