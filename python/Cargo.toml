[workspace]

[package]
name = "ghee-python"
version = "0.4.1-dev"
edition = "2021"
description = "Python bindings for the ghee GLSL scene renderer."
license = "MIT AND FTL"
repository = "https://github.com/holofermes/ghee"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ghee = { path = ".." }
anyhow = "1"
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"

[profile.release]
lto = "thin"
