[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ghee-render"
description = "GLSL scene renderer for headless GPUs. Renders to KMS displays (HDMI, SPI/I2C panels), files, and H264."
readme = "README.md"
license = "MIT AND FTL"
# maturin takes license files from python/ only: these link to the files at
# the repo root.
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES"]
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/holofermes/ghee"

[tool.maturin]
module-name = "ghee._native"
python-source = "."
features = ["pyo3/extension-module"]

[tool.ruff.lint]
# A scene that the shim refuses raises ValueError whatever the type of the value
# that it refused, as the native module does.
ignore = ["TRY004"]
