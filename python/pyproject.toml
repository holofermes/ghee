[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ghee-render"
description = "GLSL scene renderer for headless GPUs. Renders to SPI/I2C panels, KMS scanout, files, and H264."
readme = "README.md"
license = "MIT"
# maturin takes license files from python/ only: these two link to the files
# at the repo root.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/holofermes/ghee"

[tool.maturin]
module-name = "ghee._native"
python-source = "."
features = ["pyo3/extension-module"]

[tool.ruff.lint]
# A scene that the shim refuses raises ValueError whatever the type of the value
# that it refused, as the native module does.
ignore = ["TRY004"]
